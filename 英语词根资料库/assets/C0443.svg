<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>form-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">FORM = SHAPE / PATTERN</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">把材料、规则或想法塑造成一种清楚的样子</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">塑出形状</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">form · formation · deform</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">转成新样子</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">reform · transform · preform</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">统一与符合</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">uniform · conform · conformity</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">规定形式</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">formal · format · formula</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">让认识成形</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">inform · information ·</text>
<text class="note" x="600" y="431" text-anchor="middle" font-size="19">formulate</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">另源：做出来</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">perform · performance ·</text>
<text class="note" x="1000" y="431" text-anchor="middle" font-size="19">outperform</text>
</svg>