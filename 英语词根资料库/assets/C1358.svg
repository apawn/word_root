<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>soci-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">SOCI = COMPANION / TOGETHER</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">人结成伙伴，也把关系、记忆与事物连在一起</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">共同生活</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">social · society · societal</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">乐于交往</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">sociable · socialize ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">sociability</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">有益与有害的行为</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">prosocial · antisocial ·</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">dissocial</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">把关系连起来</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">associate · association ·</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">associative</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">把关系拆开</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">dissociate · dissociation</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">研究与制度主张</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">sociology · sociologist ·</text>
<text class="note" x="1000" y="431" text-anchor="middle" font-size="19">socialism</text>
</svg>