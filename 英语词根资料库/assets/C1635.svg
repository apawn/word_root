<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>vid-, vis-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">VID / VIS = SEE</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">眼睛看见 → 心里看明白 → 提前想到并作安排</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">看得见什么</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">video · view · visible · visual</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">心里看见什么</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">vision · envision · envisage</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">再看、上面看、相互看</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">review · supervise · interview</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">预先看见并照顾</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">provide · provision · prudent</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">看明白后给依据或建议</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">evident · evidence · advice</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">带着情绪或隐私意味看</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">envy · invidious · voyeur</text>
</svg>