<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>jus-, jur-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">JUS / JUR = RIGHT, LAW</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">用一把“应不应该”的尺，判断是否合乎公道</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">合乎公道</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">just · justice · justly</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">证明站得住</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">justify · justification ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">justifiable</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">法律与权限</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">jurisdiction · jurist ·</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">jurisprudence</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">誓言与承诺</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">jury · perjury · abjure</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">侵害与伤害</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">injury · injure · injurious</text>
</svg>