<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="831" viewBox="0 0 1200 831" role="img">
<title>pot-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="829" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">POT：有能力做成事；有力量掌控事物</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">手里有可以推动事情的力量：打开机器、作出决定、掌握物品；种子里则有尚未发挥的能力</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">实际力量与作用</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">power · powerful · potent ·</text>
<text class="note" x="200" y="281" text-anchor="middle" font-size="19">potency</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">潜力和潜在影响</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">potential · potentially ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">potentiality</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">有无实现空间</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">possible · possibility ·</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">impossible · impossibility</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">把自主权交给人或收走</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">empower · empowerment ·</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">disempower · disempowerment</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">缺乏力量与压倒性的力量</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">powerless · impotence ·</text>
<text class="note" x="600" y="431" text-anchor="middle" font-size="19">overpower · overpowering</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">掌握物品与占有欲</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">possess · possession ·</text>
<text class="note" x="1000" y="431" text-anchor="middle" font-size="19">possessive · possessiveness</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">收回、剥夺占有</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">repossess · repossession ·</text>
<text class="note" x="200" y="581" text-anchor="middle" font-size="19">dispossess · dispossession</text>
<text x="600" y="515" text-anchor="middle" font-size="26" font-weight="600">不同来源的动力</text>
<text class="note" x="600" y="555" text-anchor="middle" font-size="19">horsepower · hydropower ·</text>
<text class="note" x="600" y="581" text-anchor="middle" font-size="19">manpower · brainpower ·</text>
<text class="note" x="600" y="607" text-anchor="middle" font-size="19">willpower</text>
<text x="1000" y="515" text-anchor="middle" font-size="26" font-weight="600">强大的个人、机构与国家</text>
<text class="note" x="1000" y="555" text-anchor="middle" font-size="19">powerhouse · superpower ·</text>
<text class="note" x="1000" y="581" text-anchor="middle" font-size="19">potentate</text>
<text x="200" y="681" text-anchor="middle" font-size="26" font-weight="600">希腊语同源旁支：主人与专制</text>
<text class="note" x="200" y="721" text-anchor="middle" font-size="19">despot · despotic · despotism</text>
<text x="600" y="681" text-anchor="middle" font-size="26" font-weight="600">全能与特定的分化能力</text>
<text class="note" x="600" y="721" text-anchor="middle" font-size="19">omnipotent · pluripotent ·</text>
<text class="note" x="600" y="747" text-anchor="middle" font-size="19">totipotent · multipotent</text>
<text x="1000" y="681" text-anchor="middle" font-size="26" font-weight="600">增强作用与重复不再改变</text>
<text class="note" x="1000" y="721" text-anchor="middle" font-size="19">potentiate · potentiation ·</text>
<text class="note" x="1000" y="747" text-anchor="middle" font-size="19">idempotent · idempotence</text>
</svg>