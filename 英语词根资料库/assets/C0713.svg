<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>medi-, -midi-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">MEDI = MIDDLE</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">两端之间有个中间位置：可以承载、协调，也可以被拿掉</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">居中承载</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">medium · media · multimedia</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">居间沟通</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">mediate · mediation · mediator</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">中间没有隔层</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">immediate · immediately ·</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">immediacy</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">位置与数值</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">mean · median · intermediate</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">时代与地理</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">medieval · Mediterranean ·</text>
<text class="note" x="600" y="431" text-anchor="middle" font-size="19">meridian</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">平常与半份</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">mediocre · mediocrity · moiety</text>
</svg>