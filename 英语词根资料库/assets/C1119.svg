<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img">
<title>prem-, -prim-, press-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="663" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">PREM / PRESS = PRESS</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">手往下按，可能压低东西，也可能在表面留下形状</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">直接施力与压力</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">press · pressure · pressurize</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">挤紧与解除压缩</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">compress · compression ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">decompress</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">压下、下陷、低落</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">depress · depression ·</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">depressed</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">不公正地压住人</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">oppress · oppression ·</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">oppressive</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">压住显露或发展</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">suppress · repress · reprimand</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">在心里留下印记</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">impress · impression ·</text>
<text class="note" x="1000" y="431" text-anchor="middle" font-size="19">impressive</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">把内在意思表现出来</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">express · expression ·</text>
<text class="note" x="200" y="581" text-anchor="middle" font-size="19">expressive</text>
<text x="600" y="515" text-anchor="middle" font-size="26" font-weight="600">在表面留下图文</text>
<text class="note" x="600" y="555" text-anchor="middle" font-size="19">print · imprint · blueprint</text>
</svg>