<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img">
<title>plac-, plea-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="663" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">PLAC / PLEAS = PLEASE</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">心里点头：舒服、满意、合我的意</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">让人高兴与满意</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">please · pleased · pleasing</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">舒服、好相处</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">pleasant · pleasantly ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">pleasantness</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">感到不舒服、不满意</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">unpleasant · displease ·</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">displeasure</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">体验中的快乐</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">pleasure · pleasurable ·</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">pleasance</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">轻松话与寒暄</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">pleasantry</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">对自己满意、对别人迁就</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">complacent · complaisant</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">被接受的事项、诉求</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">plea · plead · pleading</text>
<text x="600" y="515" text-anchor="middle" font-size="26" font-weight="600">安慰与平静支线</text>
<text class="note" x="600" y="555" text-anchor="middle" font-size="19">placebo · placid</text>
</svg>