<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="365" viewBox="0 0 1200 365" role="img">
<title>port-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="363" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">PORT：三个来源分别看</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">同样的字母，不要画成同一条祖先链</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">portāre：携带、承载</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">support · report · transport ·</text>
<text class="note" x="200" y="281" text-anchor="middle" font-size="19">important</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">porta：门、入口</text>
