<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img">
<title>maj-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="663" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">把同类放在一起，分量、份额或地位更高的一边。</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">两堆石头，一堆更大 → 更多选票、更高地位、更大影响。</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">重要或主要</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">major, majorly</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">人数更多</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">majority, supermajority</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">多数决定</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">majoritarian, majoritarianism</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">城镇负责人</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">mayor, mayoral</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">雄伟与尊严</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">majesty, majestic</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">专业与表演</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">majordomo, majorette</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">字母与几何</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">majuscule, semimajor</text>
</svg>