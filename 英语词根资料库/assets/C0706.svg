<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="681" viewBox="0 0 1200 681" role="img">
<title>man-, manu-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="679" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">MANUS = HAND</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">想象一只手：能做东西、握住不放、驾驭缰绳，也能把任务交到另一只手里。</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">亲手做与照料</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">manual / manufacture /</text>
<text class="note" x="200" y="281" text-anchor="middle" font-size="19">manuscript / manicure</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">握住、保持与管理</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">maintain / maintenance / manage</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">/ management</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">灵巧地操作</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">manipulation / manipulate /</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">maneuver；旧农活分出 manure</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">交付职责与发令</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">mandate / command / demand /</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">recommend</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">解除支配</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">emancipate / emancipation /</text>
<text class="note" x="600" y="431" text-anchor="middle" font-size="19">manumit / manumission</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">手与形态命名</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">manus / manubrium / bimanual /</text>
<text class="note" x="1000" y="431" text-anchor="middle" font-size="19">maniform</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">需要分别核对的旁支</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">manner 经法语转变；manifestus</text>
<text class="note" x="200" y="581" text-anchor="middle" font-size="19">第二成分未定；adminiculum 远源</text>
<text class="note" x="200" y="607" text-anchor="middle" font-size="19">有分歧</text>
</svg>