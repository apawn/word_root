<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="681" viewBox="0 0 1200 681" role="img">
<title>sign-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="679" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">SIGN = A MEANINGFUL MARK</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">在纸上做一个记号：它可以说明“这是我”，也可以指明“这一份归你”，还可以画出“将来要做成这样”。</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">看懂标记与传递信号</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">sign / signal / signage /</text>
<text class="note" x="200" y="281" text-anchor="middle" font-size="19">signpost</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">留下身份确认</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">signature / signatory /</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">countersign / signet</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">表达意义与重要性</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">signify / significant /</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">significance</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">先规划，再指定</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">design / redesign / designate /</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">designation</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">给任务、权利安排归属</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">assign / assignment / assignee</text>
<text class="note" x="600" y="431" text-anchor="middle" font-size="19">/ consign / consignment</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">交还与无奈接受</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">resign / resignation / resigned</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">身份徽记与旗号</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">insignia / insigne / ensign</text>
<text x="600" y="515" text-anchor="middle" font-size="26" font-weight="600">从封印走向封闭</text>
<text class="note" x="600" y="555" text-anchor="middle" font-size="19">seal / sealed / sealing /</text>
<text class="note" x="600" y="581" text-anchor="middle" font-size="19">sealer / sealant / unseal /</text>
<text class="note" x="600" y="607" text-anchor="middle" font-size="19">sigil</text>
</svg>