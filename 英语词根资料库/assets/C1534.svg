<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img">
<title>trah-, tract-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="663" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">TRAH / TRACT = PULL, DRAW</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">同一个“拉”的动作，方向一变，意思就跟着变</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">拉到这里：吸引</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">attract · attractive ·</text>
<text class="note" x="200" y="281" text-anchor="middle" font-size="19">attraction</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">拉成一团：收紧或订约</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">contract · contraction ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">contractor</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">从中抽出：提取或抽象</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">extract · abstract ·</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">abstraction</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">注意力被拉走</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">distract · distracted ·</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">distraction</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">拿走与拉回</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">subtract · detract · retract</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">动手处理与引导</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">tractable · treat · treaty ·</text>
<text class="note" x="1000" y="431" text-anchor="middle" font-size="19">train</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">线条与形象</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">trait · portray · portrait</text>
</svg>