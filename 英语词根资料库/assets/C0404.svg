<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>famili-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">FAMILI = HOUSEHOLD / FAMILIAR</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">常在同一个家里相处 → 亲近 → 不再陌生</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">一家人或同族的一组</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">family · familial</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">知道、认得、相处熟</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">familiar · familiarity ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">familiarly</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">从陌生到熟悉</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">unfamiliar · familiarize ·</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">familiarization</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">亲近超过边界</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">overfamiliar · overfamiliarity</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">多个住户与分类分组</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">multifamily · subfamily ·</text>
<text class="note" x="600" y="431" text-anchor="middle" font-size="19">superfamily</text>
</svg>