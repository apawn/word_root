<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>ali-, alter-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">ALI / ALTER = OTHER</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">把目光从这一个，移到另一个</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">属于别处</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">alien · alienate</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">变成另一种样子</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">alter · alteration</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">另一方轮上来</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">alternate · alternative</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">另一个名字或地点</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">alias · alibi</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">把别人放在心上</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">altruism · altruistic</text>
</svg>