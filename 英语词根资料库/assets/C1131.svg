<rect x="1" y="1" width="1198" height="663" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">PROB = TEST / PROVE / APPROVE</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">拿来检验：站得住吗？合格吗？值得认可吗？</text>
