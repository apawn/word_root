<text class="note" x="600" y="255" text-anchor="middle" font-size="19">probable · probably ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">probability</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">认可与不认可</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">approve · approval · disapprove</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">品格与责备</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">probity · reprove · reprobate</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">深入探查与考察</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">probe · probation ·</text>
<text class="note" x="600" y="431" text-anchor="middle" font-size="19">probationary</text>
