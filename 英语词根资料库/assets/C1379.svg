<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>spec-, -spic-, spect-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">SPEC / SPIC / SPECT：把目光投向某处</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">看什么、朝哪里看，逐渐变成怎样理解与评价</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">检查、内省与环顾</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">inspect · introspection ·</text>
<text class="note" x="200" y="281" text-anchor="middle" font-size="19">circumspect</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">朝前、朝后看</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">expect · prospect ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">retrospective</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">怎样看待别人</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">respect · despise · suspect</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">展示与观看</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">spectacle · spectator ·</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">spectrum</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">外观变成种类</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">species · special · specific</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">观察变成推想</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">speculate · speculative ·</text>
<text class="note" x="1000" y="431" text-anchor="middle" font-size="19">speculator</text>
</svg>