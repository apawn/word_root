<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img">
<title>mit-, miss- (MIT-)：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="663" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">MIT / MISS = SEND, LET GO</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">手里的东西放出去 → 送到某处、交给某人 → 放行、托付、减免</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">把内容、任务送出去</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">message · messenger · mission ·</text>
<text class="note" x="200" y="281" text-anchor="middle" font-size="19">missile</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">让进去、让通过</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">admit · admission · permit ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">permission</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">交托与承担</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">commit · commitment ·</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">commission · committee</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">传送与排放</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">transmit · transmission · emit</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">· emission</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">提前说出、放在论证前面</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">promise · promising · premise ·</text>
<text class="note" x="600" y="431" text-anchor="middle" font-size="19">premiss</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">放走、略过与减轻</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">dismiss · omit · remit ·</text>
<text class="note" x="1000" y="431" text-anchor="middle" font-size="19">remission</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">向内放与中间暂停</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">intromit · intromission ·</text>
<text class="note" x="200" y="581" text-anchor="middle" font-size="19">intermit · intermittent</text>
<text x="600" y="515" text-anchor="middle" font-size="26" font-weight="600">形态变化较大的支线</text>
<text class="note" x="600" y="555" text-anchor="middle" font-size="19">mess · entremet · surmise ·</text>
<text class="note" x="600" y="581" text-anchor="middle" font-size="19">demise</text>
</svg>