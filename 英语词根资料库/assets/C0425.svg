<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>fin-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">FIN = END / LIMIT</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">一条线：事情到这里结束，范围到这里为止</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">到达终点</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">final · finish · finale</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">划清范围</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">define · definition · confine</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">有没有尽头</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">finite · infinite · infinitely</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">结清与钱款</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">fine · finance · financial</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">做到精纯</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">refine · refinement · refinery</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">边界相接</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">affinity</text>
</svg>