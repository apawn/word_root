<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>exquisiteness：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：quaerere；分词 quaesitus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">寻找；询问；设法得到</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：ex- + quaerere → exquirere；分词 exquisitus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">搜寻出来；仔细挑选；ex- 有向外、彻底之意</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语：exquisitus</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">精选的；讲究的；达到很高程度的</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：exquisite</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">精美的；细腻的；强烈的</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：exquisiteness</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">精美、精妙或细腻的品质</text>
</svg>