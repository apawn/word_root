<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>diffeomorphism：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：dis- + ferre → differre</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">分开 + 带、承载 → 带开；不同</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">英语数学词：differentiate → differentiable</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">求导 → 可微的</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">并列材料：differentiable + homeomorphism</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">可微性质 + 保持拓扑对应的映射</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语缩合：diffeomorphism</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">映射及其逆映射都可微；常用光滑版本</text>
</svg>