<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>cadaverine：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：cadāver</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">尸体</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">化学命名：cadaver + -ine</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">按腐败联系命名的胺</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：cadaverine</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">尸胺，pentane-1,5-diamine</text>
</svg>