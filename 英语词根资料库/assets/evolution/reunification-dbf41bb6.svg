<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>reunification：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">词源成分：uni- + facere 一支</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">一 + 使成为</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">英语 unify／法语 unification 等</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">使成为一体；统一</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：unification</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">统一的过程；具体借入路线有不同分析</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：reunification</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">重新统一</text>
</svg>