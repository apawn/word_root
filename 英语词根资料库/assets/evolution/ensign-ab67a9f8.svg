<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>ensign：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：signum</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">让人认出、明白某事的标记；更早来源有争议</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：in- + signum → īnsignis</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">带有标记的、显著的；这里 in- 不是否定</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁名词 īnsigne；复数 īnsignia</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">辨别身份的标志、徽记</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">古法语 enseigne → 中古英语 ensigne</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">旗帜、标志</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：ensign</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">舰旗；由旗帜、执旗职务相关历史发展为军衔称呼</text>
</svg>