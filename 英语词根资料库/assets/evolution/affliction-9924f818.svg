<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>affliction：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：flīgere（词典形式 flīgō）</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">击打；撞击</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：afflīgere → afflīctāre</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">打击 → 折磨</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语：afflīctiō</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">痛苦；磨难</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">古法语：afliction</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">苦难</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：affliction</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">病痛；使人受苦的事</text>
</svg>