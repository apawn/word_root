<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="774" viewBox="0 0 1000 774" role="img">
<title>maneuverability：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="772" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：manus；manū 是“用手、在手中”等屈折形式</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">手；由手引申的操作、掌握、权力</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">中古拉丁语：manopera / manuopera；动词 *manuoperāre</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">手工劳动；用手劳作</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语：manovre；manovrer</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">手工活；操作、劳作</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">法语：manœuvre / manœuvrer</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">操作；调度、移动</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：maneuver / manoeuvre</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">有技巧的移动；策略、调度</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：maneuverable</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">能灵活操控的</text>
<text class="note" x="500" y="637" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="666" text-anchor="middle" font-size="25" font-weight="600">英语：maneuverability</text>
<text class="note" x="500" y="702" text-anchor="middle" font-size="20">操控、改变位置的灵活程度</text>
</svg>