<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>reassurance：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：cūra / cūrāre</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">关心、照料；操心</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：sēcūrus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">没有忧虑；安全的</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语：asseürer</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">使放心；保证</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">古法语：asseürance</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">保证；确信</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：assurance</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">保证；信心；保险</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：reassurance</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">恢复信心的安慰</text>
</svg>