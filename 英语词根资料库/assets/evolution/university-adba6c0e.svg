<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>university：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：ūnus；构词形式 ūni-</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">一；单个；合成一个整体</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：ūni- + versus → ūniversus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">合在一起 → 全部、整体</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语：ūniversitās</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">整体；结合成一体的团体</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">中古拉丁语：学术共同体；古法语 université</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">教师、学生组成的团体</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：university</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">大学</text>
</svg>