<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="389" viewBox="0 0 1000 389" role="img">
<title>tend：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="387" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：tendere（tendō）</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">伸展；拉紧；朝某处用力</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">法语 tendre → 英语 tend（趋向）；拉丁 attendere → 英语 attend</text>
<text x="500" y="177" text-anchor="middle" font-size="25" font-weight="600">→ tend（照料）</text>
<text class="note" x="500" y="213" text-anchor="middle" font-size="20">两条相关路线：朝向；留心照管</text>
<text class="note" x="500" y="252" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="281" text-anchor="middle" font-size="25" font-weight="600">现代英语：tend</text>
<text class="note" x="500" y="317" text-anchor="middle" font-size="20">往往会；照料</text>
</svg>