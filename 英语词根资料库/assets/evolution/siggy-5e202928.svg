<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>siggy：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：signum</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">让人认出、明白某事的标记；更早来源有争议</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：signāre</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">做记号、盖印、指明</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语 signātūra；中古拉丁语的签署、文书义</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">与 signātus“已标记的”同支</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">法语 signature 或直接拉丁语借入 → 英语 signature</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">签名；可识别的特征</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：signature → sig + -y → siggy</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">网络口语中的签名、签名档</text>
</svg>