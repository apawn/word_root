<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>ascertain：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：cernere</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">筛分、分开；辨别、作出判断</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：certus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">已确定的；传统解释与 cernere 的分词形式相关</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">重构通俗拉丁语：*certānus</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">由 certus 扩展的词形；星号表示重构</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">古法语：certain</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">确定的、可靠的</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">古法语：a- + certener → acertener</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">使明确、确认</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">中古英语 acerteynen → 英语 ascertain</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">查明、弄清</text>
</svg>