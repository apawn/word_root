<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>irrespective：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：specere / speciō</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">看；观察</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：respectus → respectivus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">顾及、关系 → 与某项相关的</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：respective</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">各自的；分别对应的</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：irrespective</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">不把某条件纳入考虑</text>
</svg>