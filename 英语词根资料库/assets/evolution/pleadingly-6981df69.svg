<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>pleadingly：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：placēre</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">使人喜欢、满意；得到认可</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：placitum</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">所认可、议定的事项；意见、裁定</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">中古拉丁语法律用语 → 古法语 plait / plaid</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">诉讼、案件、主张</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">古法语：plaider → 英语 plead</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">提出诉讼主张 → 恳求、辩护</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：pleading → pleadingly</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">恳求的 → 用恳求的方式</text>
</svg>