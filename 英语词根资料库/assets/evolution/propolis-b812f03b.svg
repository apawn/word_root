<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>propolis：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">古希腊语：pro- + pólis → própolis</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">城前；也用来称蜂胶</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语 propolis → 中世纪借入路线</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">蜂胶这一名称的流传</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">中古英语 propoleos 等形式 → 英语 propolis</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">蜜蜂用于封缝等用途的树脂性材料</text>
</svg>