<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>displeasing：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：placēre</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">使人喜欢、满意；得到认可</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语 displicēre → 古法语 desplaisir</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">不讨喜欢；使不满</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：displease</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">使人不悦</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：displeasing</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">带来不悦感受的</text>
</svg>