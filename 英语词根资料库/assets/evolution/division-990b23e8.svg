<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>division：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：dīvidere；分词 dīvīsus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">分开；分配；di- 在这里有分离的意思</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语 dīvīsiō → 古法语 division</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">分割这一过程；分出的部分</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">中古英语 divisioun → 英语 division</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">分配；除法；部门；分歧</text>
</svg>