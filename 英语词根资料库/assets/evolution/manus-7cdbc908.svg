<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="254" viewBox="0 0 1000 254" role="img">
<title>manus：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="252" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：manus；manū 是“用手、在手中”等屈折形式</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">手；由手引申的操作、掌握、权力</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">英语学术借词：manus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">手及对应前肢末端；特定历史权力名称</text>
</svg>