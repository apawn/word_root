<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>inaccurate：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：cūra / cūrāre</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">关心、照料；操心</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：accūrāre → accūrātus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">仔细照料 → 认真做好的</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：accurate</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">准确的；符合实际的</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：inaccurate</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">未能符合事实或目标的</text>
</svg>