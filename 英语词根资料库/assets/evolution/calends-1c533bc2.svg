<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>calends：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：calāre</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">呼叫；正式宣布</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：kalendae / calendae</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">每月第一天</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古英语 calend；中古英语 calendes → calends</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">保留罗马历月初名称</text>
</svg>