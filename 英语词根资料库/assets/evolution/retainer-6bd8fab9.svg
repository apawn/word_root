<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>retainer：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：tenēre（teneō）；分词 tentus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">握住、持有、保持</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：re- + tenēre → retinēre</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">留住、扣住；记住</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语：retenir；中古英语：reteinen</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">保留；雇用、留用</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：retain</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">保留；记住；留用</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：retainer</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">留住服务、位置的安排或器具；被留用者</text>
</svg>