<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>parison：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">两条来源：拉丁 parāre；希腊 par- + isos</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">准备；近于 + 相等</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">法语 parer → paraison；希腊 parisos → parison</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">准备好的毛坯；平衡的句式</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：parison</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">制造业坯料；另指修辞对称</text>
</svg>