<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="254" viewBox="0 0 1000 254" role="img">
<title>classical：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="252" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：classis → classicus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">等级 → 一流的、可作范本的</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">英语：classical</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">采用拉丁语词干与 -al 形式，表示古典的、传统的</text>
</svg>