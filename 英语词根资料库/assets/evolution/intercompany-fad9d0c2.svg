<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>intercompany：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：pānis</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">面包；维持生活的食物</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">后期拉丁语：com- + pānis → compāniō</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">一起 + 面包 → 一起吃饭的伙伴</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语：compaignon 词族 → compaignie</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">伙伴 → 同伴关系、一群人</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">中古英语 companye → 英语 company</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">陪伴；团体；后来也指公司</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：inter- + company → intercompany</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">发生在不同公司之间的</text>
</svg>