<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>nanoparticle：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：pars，词干 part-</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">部分；一份；一方</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：particula</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">小小的一部分</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">法语：particule</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">小部分</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：particle</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">微粒；小品词</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">现代英语：nano- + particle</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">纳米尺度 + 颗粒</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：nanoparticle</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">纳米颗粒</text>
</svg>