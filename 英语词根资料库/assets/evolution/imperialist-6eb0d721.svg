<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="774" viewBox="0 0 1000 774" role="img">
<title>imperialist：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="772" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：parāre（parō）</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">准备；备办；安排、置办</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：in- + parāre → imperāre</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">安排、命令；行使指挥权</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语：imperium</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">命令权；统治权、统治范围</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">拉丁语：imperiālis</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">帝国、皇帝的</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">古法语 imperial → 中古英语及英语 imperial</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">帝国的；帝制相关的</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语 imperial + -ist；受法语 impérialiste 影响</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">形成“支持帝国式统治的人”</text>
<text class="note" x="500" y="637" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="666" text-anchor="middle" font-size="25" font-weight="600">英语：imperialist</text>
<text class="note" x="500" y="702" text-anchor="middle" font-size="20">帝国主义者；帝国主义的</text>
</svg>