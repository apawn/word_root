<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>typeface：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：faciēs</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">样子；脸</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">通俗拉丁语：*facia</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">由 faciēs 演变的重建形式</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语：face</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">脸；外表</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：face</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">脸；表面；面对</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：typeface</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">字体设计；字样体系</text>
</svg>