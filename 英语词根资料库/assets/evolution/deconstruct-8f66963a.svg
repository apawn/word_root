<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>deconstruct：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：struere；分词 structus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">堆叠、排列，把材料搭起来</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：con- + struere → construere</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">把各部分搭到一起；建造</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁 constructio → 法语 construction</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">搭建、构造</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">法语 déconstruction；英语也有早期拆解义</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">拆开已有构造；哲学用法经法语作品传播</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：deconstruction</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">拆解；解构式分析</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：deconstruct</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">由名词反构出的动词；拆解、解构</text>
</svg>