<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>overpower：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：potis</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">有能力的；有支配力量的</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">通俗拉丁语：*potere</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">能够；星号表示重构形式</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语 povoir / poeir；盎格鲁法语 pouair</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">能、能力；动词不定式也作名词</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">中古英语 power / poer → 英语 power</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">能力；权力；动力；后来也作动词</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：over- + power → overpower</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">以更强力量压倒</text>
</svg>