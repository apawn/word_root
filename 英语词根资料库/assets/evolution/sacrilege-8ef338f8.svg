<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>sacrilege：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：sacer + legere</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">神圣 + 拿走</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：sacrilegus → sacrilegium</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">盗取圣物者 → 盗取、侵犯圣物</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">法语及英语：sacrilege</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">亵渎；冒犯</text>
</svg>