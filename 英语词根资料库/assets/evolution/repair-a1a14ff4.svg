<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>repair：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">两条来源：拉丁 parāre；拉丁 patria</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">备办；故乡</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁 reparāre；晚期拉丁 repatriāre</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">恢复；返回故乡</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">法语 reparer；古法语 repairier</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">修复；返回、前往</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：repair</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">修复；另有正式的“前往”义</text>
</svg>