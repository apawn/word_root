<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>reassignment：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：signum</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">让人认出、明白某事的标记；更早来源有争议</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：signāre</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">做记号、盖印、指明</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语：ad- + signāre → assignāre / adsignāre</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">用标记指定、划归</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">古法语：assigner → assignement</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">分派、转让的行为</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">中古英语 assignement → 英语 assignment</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">被交付的任务；分配、转让</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：re- + assignment → reassignment</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">任务、岗位或归属的重新安排</text>
</svg>