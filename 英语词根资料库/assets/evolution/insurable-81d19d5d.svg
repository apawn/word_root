<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="774" viewBox="0 0 1000 774" role="img">
<title>insurable：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="772" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：cūra / cūrāre</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">关心、照料；操心</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：sēcūrus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">无须操心；安全、放心</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语：seür</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">安心；确定</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">盎格鲁诺曼语：enseurer</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">使确定、使安全</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">中古英语：ensuren / insuren</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">使确定、提供保障</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：insure</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">投保；承保</text>
<text class="note" x="500" y="637" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="666" text-anchor="middle" font-size="25" font-weight="600">英语：insurable</text>
<text class="note" x="500" y="702" text-anchor="middle" font-size="20">可以获得保险保障的</text>
</svg>