<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="593" viewBox="0 0 1000 593" role="img">
<title>constructivist：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="591" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：struere；分词 structus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">堆叠、排列，把材料搭起来</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：con- + struere → construere</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">把各部分搭到一起；建造</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">近代的两类命名路线</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">艺术义经俄语 konstruktivizm；其他理论用语可按 constructive + -ism 理</text>
<text class="note" x="500" y="313" text-anchor="middle" font-size="20">解</text>
<text class="note" x="500" y="352" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="381" text-anchor="middle" font-size="25" font-weight="600">英语：constructivism</text>
<text class="note" x="500" y="417" text-anchor="middle" font-size="20">构成主义艺术；各学科中的建构主义</text>
<text class="note" x="500" y="456" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="485" text-anchor="middle" font-size="25" font-weight="600">英语：constructivist</text>
<text class="note" x="500" y="521" text-anchor="middle" font-size="20">相关理论的支持者或方法；构成主义艺术家或作品</text>
</svg>