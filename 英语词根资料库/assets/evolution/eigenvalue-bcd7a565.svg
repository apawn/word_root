<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>eigenvalue：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：valēre</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">有力量、身体好；有用、值得</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">古法语：valoir → value；盎格鲁法语 valuer</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">值得 → 价值名词；估价动词</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：value</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">借入价值名词；动词有借入或名词转用分析</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：eigen- + value〔仿德语 Eigenwert〕</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">保留德语 eigen-，用英语 value 对应 Wert</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：eigenvalue</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">特定方向上被缩放的倍数</text>
</svg>