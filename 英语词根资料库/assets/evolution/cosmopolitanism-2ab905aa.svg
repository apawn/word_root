<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>cosmopolitanism：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">古希腊语：kósmos + polítēs → kosmopolítēs</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">世界 + 公民 → 世界公民</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语 cosmopolītēs → 法语 cosmopolite</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">世界公民</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：cosmopolite</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">不局限于一地的世界公民</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：cosmopolitan</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">世界性的；有多元文化经验的</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：cosmopolitanism</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">世界公民的观念；跨文化的开放性</text>
</svg>