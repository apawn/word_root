<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>secrete：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：cernere</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">筛分、分开；辨别、作出判断</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：sē- + cernere → sēcernere</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">分开、单独放到一边</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语的平行形式：sēcrētus / sēcrētum；sēcrētiō</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">隔开的、秘密；分离、分泌</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">分别进入英语的 secret；secretion</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">秘密或藏匿；分泌</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：secrete</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">分泌义与 secretion 逆构相关；藏匿义另由 secret 改形</text>
</svg>