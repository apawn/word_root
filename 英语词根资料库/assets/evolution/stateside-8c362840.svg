<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>stateside：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：stāre</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">站立；保持位置</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：status</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">站立的样子；处境、地位</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语：estat → 中古英语 stat</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">状态；身份；政治组织</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：state</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">状态；国家、州；陈述</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：the States + -side → stateside</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">美国这一边；在美国本土</text>
</svg>