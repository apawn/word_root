<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>found：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">三条来源：fundāre；fundere；日耳曼语 find 词族</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">建立；倾倒、铸造；找到</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">各自传入：法语 fonder / fondre；古英语 findan</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">建立与铸造走法语路线；找到是本族继承词</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语同形：found</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">建立；铸造；find 的过去式与过去分词</text>
</svg>