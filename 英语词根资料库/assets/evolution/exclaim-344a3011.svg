<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>exclaim：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：clāmāre</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">喊、呼叫；大声宣布。与 calāre 同源，不是英语 claim 造出的拉丁词</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：exclāmāre</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">大声喊出；ex- 有向外或加强作用</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">两种路径：法语 exclamer；英语 exclamation 反构</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">法语动词借入；或从较早名词形成动词</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：exclaim</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">惊呼、激动地说</text>
</svg>