<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>accidentally：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：cadere</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">落下；倒下；发生</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：accidere → accidēns</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">ad- + cadere；发生、降临 → 发生的</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">晚期拉丁语：accidentālis</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">附带的；偶然的</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">法语：accidentel / accidental</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">偶发的</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：accidental</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">无意的；偶然的；音乐中的临时变音</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：accidentally</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">不是有意地；偶然地</text>
</svg>