<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>adunation：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：ūnus；构词形式 ūni-</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">一；单个；合成一个整体</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：adūnāre → adūnātiō</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">使合一 → 合一的动作或状态</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：adunation</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">联合；合一的古旧用词</text>
</svg>