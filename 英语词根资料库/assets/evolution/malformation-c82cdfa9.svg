<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>malformation：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：fōrma</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">形状；样式；模子</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">英语：formation</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">形成；成型</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语构词：mal- + formation</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">异常 + 形成</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：malformation</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">形成过程中出现的结构异常</text>
</svg>