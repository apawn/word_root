<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>prevail：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：valēre</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">有力量、身体好；有用、值得</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：praevalēre</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">力量在前、胜过；占优势</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语 prevaler → 英语 prevail</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">胜出；占主导；说服成功</text>
</svg>