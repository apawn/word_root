<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>excretion：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：cernere</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">筛分、分开；辨别、作出判断</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：ex- + cernere → excernere；分词 excrētus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">向外筛出、排出</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">后期拉丁语：excrētiō</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">向外排出的动作</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">法语 excrétion／直接拉丁借入 → 英语 excretion</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">排泄；排出物</text>
</svg>