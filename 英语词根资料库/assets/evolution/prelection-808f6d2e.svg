<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>prelection：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：legere（legō）</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">挑选；收集；阅读</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：praelegere → praelectiō</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">当众诵读 → 公开讲读</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：prelection</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">讲授；另有预读义</text>
</svg>