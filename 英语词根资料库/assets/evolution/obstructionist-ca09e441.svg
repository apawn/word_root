<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>obstructionist：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：struere；分词 structus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">堆叠、排列，把材料搭起来</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：ob- + struere → obstruere</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">在前面堆起东西；堵住</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语 obstructio → 英语 obstruction</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">阻碍这一行为或造成阻碍的东西</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：obstructionist</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">实行阻挠的人；阻挠性的</text>
</svg>