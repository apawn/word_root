<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>eligibility：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：legere（legō）</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">挑选；收集；阅读</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：ēligere → ēligibilis</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">挑选 → 可被选中的</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">法语及英语：eligible</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">符合被选择或参与的条件</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：eligibility</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">符合参与或被选条件的状态</text>
</svg>