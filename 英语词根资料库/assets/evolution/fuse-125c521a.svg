<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>fuse：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">两条拉丁来源：fundere；fūsus〔纺锤〕</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">前者指倾倒熔化；后者指细长的纺织工具</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">不同路线：fusion → fuse 动词；fuso / fusée → fuse 名词</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">融合动作；由细长形状得名的引信</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：fuse</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">熔合；保险丝、引信；电气义的词源分析有分歧</text>
</svg>