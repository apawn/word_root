<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="489" viewBox="0 0 1000 489" role="img">
<title>probe：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="487" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：probus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">好的；可靠的；正直的</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：probāre</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">检验是否合格；证明；认可</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语 probe 的借入与转用分析</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">名词经中世纪拉丁语 proba；动词可由名词转用，也有直接借入 probāre 的</text>
<text class="note" x="500" y="313" text-anchor="middle" font-size="20">分析</text>
<text class="note" x="500" y="352" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="381" text-anchor="middle" font-size="25" font-weight="600">现代英语：probe</text>
<text class="note" x="500" y="417" text-anchor="middle" font-size="20">探针；探测器；深入调查</text>
</svg>