<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>radioactivity：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁来源成分：radius + āctīvus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">射线 + 起作用的</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">法语科学用语：radioactif → radioactivité</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">放射性的 → 放射性</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：radioactivity</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">放射性；原子核自发衰变所表现的活动</text>
</svg>