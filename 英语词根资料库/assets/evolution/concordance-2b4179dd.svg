<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>concordance：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：cor，词干 cord-</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">心；心意；记忆与情感的中心</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：concordāre → concordantia</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">彼此一致 → 一致、对应</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">法语：concordance</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">相合；对照</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：concordance</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">一致；供查对的词语索引</text>
</svg>