<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>familiarity：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：famulus → familia</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">家仆、奴仆 → 家内人员与家户</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：familiāris → familiāritās</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">亲近的 → 亲近关系、熟识</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">法语 familiarité → 英语 familiarity</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">熟悉；熟络</text>
</svg>