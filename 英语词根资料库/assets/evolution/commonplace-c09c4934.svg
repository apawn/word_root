<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>commonplace：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">希腊语观念：koinos topos</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">可用于多种场合的通用论题</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语意译：locus communis</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">共同、通用的论题</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语意译：common + place</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">通用说法 → 常见、缺少新意的</text>
</svg>