<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>vituperate：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：vitium；parāre</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">过失、缺点；提出、安排</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：vituperāre</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">找过失；责骂、贬斥</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语 vituperātus 的借入；也可能由英语 vituperation 逆构</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">词形形成的两种分析</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：vituperate</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">以尖刻言辞痛斥</text>
</svg>