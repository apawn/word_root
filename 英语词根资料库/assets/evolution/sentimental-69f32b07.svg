<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>sentimental：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：sentīre（sentiō）</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">感到；察觉；认为</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语词族：sentimentum</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">感受；想法</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语：sentement</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">感情；看法</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：sentiment</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">情绪；观点；温情</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：sentimental</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">受温情、怀旧等感情影响的</text>
</svg>