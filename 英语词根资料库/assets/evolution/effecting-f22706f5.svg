<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>effecting：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：facere</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">做；制造</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：efficere → effectus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">做出 → 结果</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">法语／英语：effect</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">造成的效果；使实现</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：effecting</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">正在促成；实现着</text>
</svg>