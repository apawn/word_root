<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>consociate：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：socius</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">同伴；伙伴；盟友</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：cōnsociāre → cōnsociātus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">共同结盟 → 联合的</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：consociate</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">联合；伙伴（多见旧文或特定语境）</text>
</svg>