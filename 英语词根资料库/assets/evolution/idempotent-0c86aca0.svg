<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="254" viewBox="0 0 1000 254" role="img">
<title>idempotent：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="252" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">造词材料：拉丁 idem + potens / potent-</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">相同 + 有力量；后来用于数学中的幂</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">近代英语：idempotent</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">数学中的幂等；后来用于计算等领域</text>
</svg>