<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>annex：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：nectere（词典形式 nectō）</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">系住；绑在一起；连接</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：adnectere / annectere</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">附接到某物上</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语相关形式：annexāre / annexus</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">动词：附接；分词：被附接的</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">法语：annexer / annexe</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">动词：附接；名词：附属部分</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：annex</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">并入；附属部分</text>
</svg>