<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>politeia：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">古希腊语：pólis → polítēs</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">城邦 → 城邦的公民</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">古希腊语：politeía</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">公民身份；政体、公共生活的组织方式</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语学术转写：politeia</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">保留原词以讨论古希腊概念</text>
</svg>