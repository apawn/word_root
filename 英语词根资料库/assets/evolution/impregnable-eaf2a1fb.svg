<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="254" viewBox="0 0 1000 254" role="img">
<title>impregnable：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="252" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">两条不同来路</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">法语 imprenable：不可攻取；英语 impregnate + -able：可受浸渍</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">同形英语：impregnable</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">通常指坚不可摧；罕见另义才与 pregnant 同族</text>
</svg>