<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>arrestee：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：stāre</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">站立；保持位置</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：restāre</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">留在后面；停住</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">通俗拉丁语：*arrestāre</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">使停住（重建形式）</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">古法语：arester</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">停止；扣留</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：arrest</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">逮捕；阻止继续发展</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：arrestee</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">被实施逮捕的人</text>
</svg>