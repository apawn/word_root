<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>impressionistic：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">法语 impression → 英语 impression</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">印痕 → 心中留下的感觉</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">英语：impressionist / impression + -istic</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">印象派或印象式表达</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：impressionistic</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">着重整体观感的</text>
</svg>