<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>reduction：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：dūcere</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">带领；引导；拉出</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：redūcere → reductiō</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">带回 → 带回或转变的过程</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语：reducion</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">恢复；转变</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：reduction</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">减少；降低</text>
</svg>