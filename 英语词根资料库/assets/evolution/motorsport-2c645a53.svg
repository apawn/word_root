<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>motorsport：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：movēre（moveō）</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">移动；使动起来</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：mōtor</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">使事物移动者</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">中古英语：motour</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">推动者</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：motor</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">马达；运动的</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：motor + sport → motorsport</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">以机动车参与的竞技运动</text>
</svg>