<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>supermajority：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：maior / maius</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">更大的；地位更高的；magnus 的比较级</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">中世纪拉丁语 māiōritās → 法语 majorité</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">较大的地位、份额；成年</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：majority</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">多数；领先票数；成年身份</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：super- + majority → supermajority</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">超过普通多数的较高门槛</text>
</svg>