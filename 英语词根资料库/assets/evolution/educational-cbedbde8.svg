<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>educational：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：ēducāre</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">养育；培养</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：ēducātiō</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">养育、训练的过程</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">法语：éducation</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">教育</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：education</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">教育；培养过程</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：educational</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">与教育有关；有学习价值</text>
</svg>