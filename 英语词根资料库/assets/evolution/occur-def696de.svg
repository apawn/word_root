<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>occur：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：currere（词典形式 currō）</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">跑；流动</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：occurrere</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">迎面跑来；呈现；发生</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">法语：occurrer</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">出现；遇到</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：occur</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">发生；出现在头脑中</text>
</svg>