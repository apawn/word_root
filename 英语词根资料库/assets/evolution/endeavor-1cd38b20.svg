<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>endeavor：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：habēre</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">拿着；拥有；保持某种状态</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：dēbēre</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">欠；应当（由 dē- + habēre 构成）</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语：dever</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">职责</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">中古英语短语：put oneself in dever</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">把某事当作职责来努力</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：endeavor</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">努力尝试；投入的事业</text>
</svg>