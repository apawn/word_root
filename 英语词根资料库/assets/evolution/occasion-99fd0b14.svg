<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>occasion：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：cadere</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">落下；倒下；发生</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：occidere → occāsiō</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">落下、发生 → 机会、时机</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语：occasion / ocasiun</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">机会；情形</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：occasion</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">某次、场合；时机；引起</text>
</svg>