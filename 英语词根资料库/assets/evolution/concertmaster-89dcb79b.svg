<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>concertmaster：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">意大利语：concertare</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">协调、商定；更早与拉丁“争论”等形式的关系有争议</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">平行的命名材料：英语 concert；德语 Konzertmeister</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">音乐会；乐队首席称号</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语仿译：concert + master → concertmaster</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">参照德语称号造词，通常指第一小提琴首席</text>
</svg>