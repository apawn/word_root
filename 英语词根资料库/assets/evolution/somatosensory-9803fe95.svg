<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="254" viewBox="0 0 1000 254" role="img">
<title>somatosensory：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="252" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">希腊语相关形式：somato-；英语：sensory</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">身体 + 感觉的</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">英语：somatosensory</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">涉及触觉、身体位置等躯体感觉</text>
</svg>