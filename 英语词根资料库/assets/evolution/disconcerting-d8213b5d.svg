<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>disconcerting：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">意大利语：concertare</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">协调、商定；更早与拉丁“争论”等形式的关系有争议</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">法语：concerter → disconcerter</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">协调安排 → 打乱协调、使困惑</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：disconcert</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">扰乱镇定；使不知所措</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：disconcerting</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">使人不安、失去镇定的</text>
</svg>