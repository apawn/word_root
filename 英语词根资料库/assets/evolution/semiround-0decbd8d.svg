<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>semiround：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：rota</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">轮子；像轮子一样的圆形</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：rotundus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">圆的；圆满、圆润的</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语：ront / roünt</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">圆形的</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">中古英语、英语：round</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">圆的；绕行；一轮</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：semiround</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">半圆形的</text>
</svg>