<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>despot：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">更早的印欧语构词：*dems-pota</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">房屋的主人；第二部分与“主人、力量”有关</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">古希腊语：despotes</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">主人；统治者</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">中世纪拉丁语 despota，经意大利语、法语等传播路线</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">一种统治者称号</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：despot</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">最初可为称号；后来常指专制统治者</text>
</svg>