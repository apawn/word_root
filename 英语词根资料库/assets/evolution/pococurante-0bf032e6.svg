<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>pococurante：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">意大利语成分：poco + curante</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">很少 + 关心；curante 属于 cūrāre 词族</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">法语文学人物：Pococurante</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">《老实人》中漠然的贵族</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：pococurante</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">满不在乎的；漠然的人</text>
</svg>