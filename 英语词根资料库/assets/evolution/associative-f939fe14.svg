<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>associative：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：socius</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">同伴；伙伴；盟友</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：associāre → associātus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">结成伙伴 → 关联、联合的</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">中古英语：associat(e)</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">相联系的；伙伴</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：associate</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">联系；交往；同事、伙伴</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：associative</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">通过联系起作用；具有结合性质</text>
</svg>