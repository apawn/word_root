<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>pertinent：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：tenēre（teneō）；分词 tentus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">握住、持有、保持</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：per- + tenēre → pertinēre</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">延伸到、关联到；属于</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语：pertinēns；古法语：pertinent</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">涉及、关系到的</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：pertinent</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">切题的；与当前问题有关的</text>
</svg>