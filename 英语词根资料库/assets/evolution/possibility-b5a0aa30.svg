<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="597" viewBox="0 0 1000 597" role="img">
<title>possibility：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="595" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：potis</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">有能力的；有支配力量的</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：potis + esse → posse</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">有能力 + 是 → 能够</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语：possibilis → possibilitas</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">可能的 → 可能性</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">法语 possibilite / possibilité 及直接拉丁借入 → 中古英语</text>
<text x="500" y="385" text-anchor="middle" font-size="25" font-weight="600">possibilite</text>
<text class="note" x="500" y="421" text-anchor="middle" font-size="20">可能性</text>
<text class="note" x="500" y="460" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="489" text-anchor="middle" font-size="25" font-weight="600">英语：possibility</text>
<text class="note" x="500" y="525" text-anchor="middle" font-size="20">可能发生的情况；可考虑的方案</text>
</svg>