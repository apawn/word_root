<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>ecumenopolis：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">希腊语材料：oikouménē + pólis</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">有人居住的世界 + 城市</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">Doxiadis 的现代规划术语：Ecumenopolis</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">全球连成一个连续的人类聚居系统</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：ecumenopolis</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">全球城市系统；科幻中的星球城市</text>
</svg>