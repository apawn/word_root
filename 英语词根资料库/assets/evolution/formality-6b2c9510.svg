<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>formality：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：fōrma</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">形状；样式；模子</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：fōrmālis → 法语 formalité</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">形式的 → 正式性、规定手续</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：formality</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">礼节；程序性手续</text>
</svg>