<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>intension：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：tendere（tendō）</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">伸展；拉紧；朝某处用力</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：intendere → intēnsus → intēnsiō</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">拉紧 → 加强；用力</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：intension</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">强度、加强；逻辑中的内涵</text>
</svg>