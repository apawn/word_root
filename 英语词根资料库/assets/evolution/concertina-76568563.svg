<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>concertina：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">意大利语：concertare</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">协调、商定；更早与拉丁“争论”等形式的关系有争议</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">意大利语 concerto → 法语 concert</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">协调、合奏</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：concert（名词）</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">一致、协同；音乐会</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：concertina</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">可推拉风箱的乐器；形似它的折叠、伸缩状态</text>
</svg>