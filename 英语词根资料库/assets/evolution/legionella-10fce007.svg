<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>legionella：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：legere（legō）</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">挑选；收集；阅读</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：legiō</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">征集起来的军团</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语及英语：legion</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">军团；大量</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">专名：American Legion</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">美国退伍军人组织</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">新拉丁属名及英语：Legionella / legionella</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">以相关暴发背景命名的军团菌</text>
</svg>