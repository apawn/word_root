<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>inadvertently：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：vertere → versus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">转动、转向 → 已转过的</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：advertere</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">朝向；把注意力转向</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">中世纪拉丁语 inadvertentia → 法语 inadvertance</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">没有把注意力转到 → 疏忽</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：inadvertence → inadvertent</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">疏忽 → 不留神的、非故意的</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：inadvertently</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">因未留神而无意地做出</text>
</svg>