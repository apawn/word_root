<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>reclassify：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语 classis → 法语 classe</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">类别、分组</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">法语：classifier</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">按共同特点分到各类</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：classify</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">分类；划定信息的保密等级</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：re- + classify → reclassify</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">再次分类，常意味着改换类别</text>
</svg>