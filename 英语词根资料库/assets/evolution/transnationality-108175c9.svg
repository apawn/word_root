<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>transnationality：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：nāscī（nāscor）→ nātus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">出生、生长 → 已出生的</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：nātiō</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">出生；按出身联系的人群</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语：nacion</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">民族、人群</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">中古法语：national</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">与民族、国家有关的</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：national</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">国家的；全国的</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：nationality → transnationality</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">国家身份归属 → 跨越国界的身份与联系</text>
</svg>