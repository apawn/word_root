<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>conversational：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：vertere → versus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">转动、转向 → 已转过的</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：versāre</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">反复转动；活动、周旋</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语：conversārī</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">一起生活；与人来往</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">拉丁语 conversātiō → 古法语 conversacion</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">生活方式；交往</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：conversation</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">交往 → 交谈</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：conversational</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">与交谈有关；有聊天的感觉</text>
</svg>