<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>acquisitiveness：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：quaerere；分词 quaesitus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">寻找；询问；设法得到</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：ad- + quaerere → acquirere；分词 acquisitus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">寻求并取得；ad- 在 q 前同化为 ac-</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁分词词干 acquisit- + -ive → 英语 acquisitive</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">早期有“取得的”之义；后来常指热衷占有的</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：acquisitiveness</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">热衷获取、占有更多的倾向</text>
</svg>