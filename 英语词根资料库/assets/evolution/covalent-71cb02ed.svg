<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>covalent：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：valēre</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">有力量、身体好；有用、值得</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：valēns → valentia</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">有力量的 → 力量、能力</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">德语化学术语：Valenz</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">原子与其他原子结合的能力</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：valence</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">化学中的价；后来用于心理、语言学等领域</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：co- + valence → covalence</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">通过共享电子形成的结合</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：covalent</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">具有共价结合性质的</text>
</svg>