<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>acquirer：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：quaerere；分词 quaesitus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">寻找；询问；设法得到</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：ad- + quaerere → acquirere；分词 acquisitus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">寻求并取得；ad- 在 q 前同化为 ac-</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语 aquerre → 中古英语 acqueren</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">取得；经通俗拉丁语 *acquaerere 这一形式传来</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：acquire</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">后又受拉丁语直接借入影响形成今形；获得、学得</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：acquirer</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">取得某物的人或机构</text>
</svg>