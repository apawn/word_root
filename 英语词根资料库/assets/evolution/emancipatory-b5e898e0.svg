<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>emancipatory：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：manus；manū 是“用手、在手中”等屈折形式</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">手；由手引申的操作、掌握、权力</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：manus + capere → manceps；mancipāre</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">用手取得；所有者 → 法律上转让控制权</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语：ē- + mancipāre → ēmancipāre</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">脱离原有支配；通过法律手续释放</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">拉丁语：ēmancipātus → 英语 emancipate</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">被释放的 → 使脱离控制、解放</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：emancipatory</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">旨在或有助于促成解放的</text>
</svg>