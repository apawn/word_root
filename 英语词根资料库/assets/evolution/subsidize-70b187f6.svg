<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="774" viewBox="0 0 1000 774" role="img">
<title>subsidize：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="772" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">重构原始印欧语：*sed-</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">坐；星号表示根据后代语言重构</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：sīdere（sīdō）</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">坐下、落定；与 sedēre 同源的动词</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语：sub- + sīdere → subsīdere</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">沉下、平息；停留</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">拉丁语：subsidium</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">留作后援的兵力；帮助、援助</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">法语 subside / subsidie → 中古英语 subsidie</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">援助，尤指金钱援助</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：subsidy</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">补助、补贴</text>
<text class="note" x="500" y="637" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="666" text-anchor="middle" font-size="25" font-weight="600">英语：subsidize</text>
<text class="note" x="500" y="702" text-anchor="middle" font-size="20">提供补贴、补助费用</text>
</svg>