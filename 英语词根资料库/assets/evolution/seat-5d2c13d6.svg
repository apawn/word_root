<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>seat：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">重构原始印欧语：*sed-</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">坐；星号表示根据后代语言重构</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">日耳曼语的座位名称；古英语 sǣte、古诺尔斯语 sæti</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">座位、所在处；两种形式关系及借入影响有不同分析</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">中古英语 sete → 英语 seat</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">座位；所在地；给……安排座位</text>
</svg>