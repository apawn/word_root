<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>surveyor：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：vidēre（videō）</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">看；看见</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">古法语：sur- + veoir → surveer</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">从上方看；统览</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语／盎格鲁诺曼语：sorveor / surveour</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">察看、监督者</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：surveyor</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">测量或查验的专业人员</text>
</svg>