<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>irrotational：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：rota</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">轮子；像轮子一样的圆形</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：rotāre（rotō）；分词 rotātus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">使转动；转圈</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语：rotātiō</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">转动、旋转</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：rotation</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">旋转；轮流安排</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：rotational</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">与旋转有关的</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：irrotational</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">无局部旋转；数学上旋度为零</text>
</svg>