<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>compliment：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：plēre</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">填满；常保存在带前缀的动词里</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语 complēre → 罗曼语相关词</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">完成、履行 → 履行礼节</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">意大利语 complimento；法语 compliment / complimenter</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">礼貌话、致意；称赞</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：compliment〔名词、动词分别借入〕</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">礼貌致意；赞美、称赞</text>
</svg>