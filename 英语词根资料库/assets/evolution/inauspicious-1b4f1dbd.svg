<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>inauspicious：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：avis + specere</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">鸟 + 观察</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：auspex → auspicium</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">看鸟占卜的人 → 占卜、兆头</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">法语：auspice</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">征兆；庇护</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：auspice</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">征兆；支持、庇护</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：auspicious → inauspicious</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">有好兆头 → 开局不利的</text>
</svg>