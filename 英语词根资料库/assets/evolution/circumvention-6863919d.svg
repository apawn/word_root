<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>circumvention：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：venīre</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">来；来到某处</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：circumvenīre → circumventus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">从四周来到；包围、设计对付</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语：circumventiō / circumventionem</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">围困；设计对付；欺骗</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：circumvention</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">规避；绕过限制</text>
</svg>