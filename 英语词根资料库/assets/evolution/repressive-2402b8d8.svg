<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>repressive：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：premere；分词 pressus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">按、压、挤</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：reprimere → repressus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">re- 向回 + 压 → 按回去、遏制</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">中世纪拉丁语：repressivus</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">有遏制、压制作用的</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">借入路线：古法语 repressif 或直接借拉丁语</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">抑制、压制的性质</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：repressive</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">压制性的；限制自由的</text>
</svg>