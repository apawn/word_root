<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>recidivism：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：cadere</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">落下；倒下；发生</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：recidere → recidīvus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">re- + cadere；再落回去 → 复发的、重犯的</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">中世纪拉丁语：recidivāre → 法语 récidiver</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">重新陷入旧行为</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">法语：récidiviste → 英语 recidivist</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">屡次再犯的人</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：recidivism；参照法语 récidivisme</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">再犯的行为或现象</text>
</svg>