<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="254" viewBox="0 0 1000 254" role="img">
<title>vertebral：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="252" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：vertebra</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">关节、椎骨；通常认为与 vertere“转”有关</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">英语：vertebr- + -al → vertebral</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">与椎骨、脊柱有关的</text>
</svg>