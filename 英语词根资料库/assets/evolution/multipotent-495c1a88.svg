<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>multipotent：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：potis</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">有能力的；有支配力量的</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：potis + esse → posse</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">有能力 + 是 → 能够</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语：potens，词干 potent-</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">能够的；强有力的</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">中古英语 potent → 英语 potent</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">效力强的；影响大的</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：multi- + potent → multipotent</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">具有多种作用或发展能力</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">细胞学用法：multipotent</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">能形成一定范围内的多种细胞</text>
</svg>