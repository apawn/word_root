<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>secretly：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：cernere</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">筛分、分开；辨别、作出判断</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：sē- + cernere → sēcernere</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">分开、单独放到一边</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语：sēcrētus；名词 sēcrētum</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">被分开的、隐蔽的；秘密之事</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">拉丁名词 sēcrētum；古法语形容词 secret</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">秘密；不公开的，分别传入英语</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">中古英语 secret / secrette → 英语 secret</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">秘密；秘密的</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：secretly</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">不公开地；心里暗自</text>
</svg>