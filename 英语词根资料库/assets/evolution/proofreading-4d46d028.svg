<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>proofreading：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：probus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">好的；可靠的；正直的</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：probāre</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">检验是否合格；证明；认可</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">后期拉丁语 proba → 古法语 proeve 等形式</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">检验；证据</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：proof</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">证明、证据；供检查的样张</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：proofreader / proofread</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">校对员；校对</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：proofreading</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">校对工作的过程</text>
</svg>