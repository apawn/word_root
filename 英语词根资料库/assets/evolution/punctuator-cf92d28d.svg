<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>punctuator：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：pungere</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">刺、扎、戳</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语 punctus → 中世纪拉丁语 punctuare</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">点 → 用点作记号</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁分词 punctuatus；英语较早名词 punctuation</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">早期动词有拉丁借入；现代常用义也有名词反构分析</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：punctuate</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">加标点；不时插入、打断或强调</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：punctuate + -or → punctuator</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">执行标点处理的人、物；技术语境中的符号</text>
</svg>