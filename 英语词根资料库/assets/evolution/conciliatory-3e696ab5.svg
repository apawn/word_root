<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="254" viewBox="0 0 1000 254" role="img">
<title>conciliatory：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="252" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：concilium → conciliāre</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">把人聚到一起 → 使友好、争取好感</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">英语：conciliate → conciliatory</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">安抚、缓和 → 带有和解意味的</text>
</svg>