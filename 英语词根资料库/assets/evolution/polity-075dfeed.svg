<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>polity：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">古希腊语：pólis → polítēs</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">城邦 → 城邦的公民</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">古希腊语：politeía → 拉丁语 polītīa</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">公民身份；公共事务的组织与治理</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">法语：politie 等路线</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">公共组织与治理</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：polity</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">有组织的政治共同体；治理形式</text>
</svg>