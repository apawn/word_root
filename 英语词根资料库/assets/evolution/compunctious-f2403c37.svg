<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>compunctious：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：pungere</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">刺、扎、戳</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：com- + pungere → compungere</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">加强语气 + 刺 → 刺痛</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">后期拉丁语 compunctio → 古法语 compunction</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">心里被刺痛 → 良心不安</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">中古英语 compunccion → 英语 compunction</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">内疚；因不安而不愿做某事</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：compunct- + -ious → compunctious</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">带着或引起良心不安的</text>
</svg>