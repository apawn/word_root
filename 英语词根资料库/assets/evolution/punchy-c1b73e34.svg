<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>punchy：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：pungere</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">刺、扎、戳</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语 punct-；俗拉丁语 *punctio〔复原形式〕</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">刺；尖工具</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语：ponchon；动词 ponchonner</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">尖工具；戳、打孔</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">中古英语 punchoun / punchen</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">冲子；戳、击打；动词还可能受 punish 旧形式影响</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：punch〔工具、击打支线〕</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">打孔器；打孔；拳打；一拳的力量</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：punch + -y → punchy</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">像拳击一样有劲、有效果的</text>
</svg>