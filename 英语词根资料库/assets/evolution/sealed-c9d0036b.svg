<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>sealed：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：signum</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">让人认出、明白某事的标记；更早来源有争议</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：sigillum</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">signum 的指小形式：小标记、印章</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语 seel / seal → 中古英语 sel / sele</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">封印、印章</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：seal（封印这一支）</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">印章、封条、密封结构；由盖印封闭扩展到密封</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：seal（动词）</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">由名词转用或承接古法语 seeler；盖印、封闭、使确定</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：seal → sealed</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">封闭完成；比喻事情已定</text>
</svg>