<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="254" viewBox="0 0 1000 254" role="img">
<title>expressionist：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="252" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">法语 expression → 英语 expression</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">表达；表情；表达式</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">近代艺术用语：expressionist</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">以主观情绪塑造艺术形式的人或风格</text>
</svg>