<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>introverted：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语构件：intrō + vertere</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">向内 + 转</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">近代拉丁语、早期英语：向内转的词族</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">先用于转向内侧、思想向内等</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">20 世纪心理学：introvert / introversion</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">在荣格等人的用法中形成内向这一心理概念</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：introverted</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">有向内关注、较内向的倾向</text>
</svg>