<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>unitary：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：ūnus；构词形式 ūni-</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">一；单个；合成一个整体</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：ūnitās</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">合一；统一的状态</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语：unité；中古英语：unite</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">统一；和谐</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：unity</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">团结；统一；一体性</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语词形调整：unit</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">作为一个整体看待的单元、单位</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：unitary</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">作为一体的；围绕一个整体组织的</text>
</svg>