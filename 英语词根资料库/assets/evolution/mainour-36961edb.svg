<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>mainour：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：manus；manū 是“用手、在手中”等屈折形式</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">手；由手引申的操作、掌握、权力</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">中古拉丁语：manopera / manuopera；动词 *manuoperāre</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">手工劳动；用手劳作</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语：manovre；manovrer</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">手工活；操作、劳作</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">盎格鲁法语 mainoure / meinoure → 中古英语 manor</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">转为与现行盗窃及赃物有关的法律用语</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：mainour</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">当场查获的赃物</text>
</svg>