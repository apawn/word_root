<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>designee：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：signum</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">让人认出、明白某事的标记；更早来源有争议</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：signāre</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">做记号、盖印、指明</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语：dē- + signāre → dēsignāre</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">标出来、选定、构想</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">拉丁分词：dēsignātus → 英语 designate（形容词）</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">已指定的；已任命但未就职的</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：designate（动词）</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">后起的指定、任命；可能由形容词、designation 逆构或直接依拉丁形式形成</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：designate + -ee → designee</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">被指定去做事或代表他人的人</text>
</svg>