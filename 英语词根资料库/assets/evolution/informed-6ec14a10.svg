<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>informed：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：fōrma</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">形状；样式；模子</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：īnfōrmāre</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">赋予形状；教导</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语：enformer / informer</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">教导；告知</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：inform</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">告知；影响、塑造</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：informed</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">已经了解情况；有知识作依据</text>
</svg>