<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>inquiring：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：quaerere；分词 quaesitus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">寻找；询问；设法得到</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：in- + quaerere → inquirere；分词 inquisitus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">搜寻；调查；问明情况</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语 enquerre；中世纪拉丁语 inquerere</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">询问；探究</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">中古英语 enqueren / anqueren</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">询问；查问</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：inquire / enquire</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">in- 拼法受拉丁语影响；两种拼写延续至今</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：inquiring</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">正在询问；有求知、探询倾向的</text>
</svg>