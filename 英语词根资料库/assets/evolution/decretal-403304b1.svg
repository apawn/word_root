<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>decretal：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：cernere</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">筛分、分开；辨别、作出判断</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：dē- + cernere → dēcernere</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">判定、作出决定</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语：dēcrētum</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">已作出的决定、命令</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">后期拉丁语：dēcrētālis</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">与法令、裁决有关的</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">盎格鲁法语 → 中古英语 decretal</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">教会权威裁决文件</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：decretal</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">教皇教令；也可形容法令相关</text>
</svg>