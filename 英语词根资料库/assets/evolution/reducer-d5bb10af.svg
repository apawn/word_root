<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>reducer：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：dūcere</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">带领；引导；拉出</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：redūcere</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">带回；使回到某种状态</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语：reduire / reducer</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">带回；转变</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：reduce</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">减少；使变成较小或较低状态</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：reducer</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">实施减小或归约的部件</text>
</svg>