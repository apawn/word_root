<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>sedate：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">重构原始印欧语：*sed-</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">坐；星号表示根据后代语言重构</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：sēdāre</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">使落定、安静；通常视为与 sedēre 相应的使动形式</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语的平行形式：sēdātus；sēdātiō / sēdātīvus</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">平静的；镇静；起镇静作用的</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">分别借入的英语词：sedate（形容词）；sedation / sedative</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">平静的；镇静；镇静药</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">现代动词 sedate 的用药义</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">与 sedation / sedative 相关的逆构；旧的使平静义另联系拉丁分词干</text>
</svg>