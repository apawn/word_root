<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>reappoint：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：pungere</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">刺、扎、戳</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：punctum / puncta</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">刺出的小点；尖端</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语：point；à point → apointier</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">到恰当的位置、状态 → 安排、议定</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">盎格鲁法语 appointer → 中古英语 apointen</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">安排；决定</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：appoint</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">指定、任命；约定</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：re- + appoint → reappoint</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">再次任命到某个岗位</text>
</svg>