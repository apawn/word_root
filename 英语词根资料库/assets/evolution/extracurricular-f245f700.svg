<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>extracurricular：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：currere（词典形式 currō）</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">跑；流动</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：curriculum</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">跑程；行进路线</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">教育领域的新拉丁语用法</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">安排好的学习路线</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：curriculum</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">课程体系；教学内容安排</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：curricular</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">与课程有关的</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：extra- + curricular</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">正式课程之外的</text>
</svg>