<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>requirement：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：quaerere；分词 quaesitus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">寻找；询问；设法得到</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：re- + quaerere → requirere；分词 requisitus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">寻求；提出需要、要求</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语 requerre / requerir → 中古英语 requeren</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">寻求；请求；需要</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：require</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">需要；要求；后续用法也受直接拉丁借入影响</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：requirement</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">要求；必须满足的条件；实际需求</text>
</svg>