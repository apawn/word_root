<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>connascence：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：nāscī（nāscor）→ nātus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">出生、生长 → 已出生的</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">英语构词：con- + nascence</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">共同出生、形成</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：connascence</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">共同发生；需要协调变化的依赖</text>
</svg>