<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>piazza：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">古希腊语：platýs（πλατύς）</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">宽的；展开的；扁平的</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">希腊语：plateîa hodós → plateîa</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">宽阔的路 → 省去“路”的名词用法</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语：platēa</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">宽街；开敞空间</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">意大利语：piazza</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">城镇广场</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：piazza</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">意大利式广场；部分地区的门廊义</text>
</svg>