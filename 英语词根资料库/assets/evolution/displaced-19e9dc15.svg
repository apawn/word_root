<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>displaced：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">古希腊语：platýs（πλατύς）</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">宽的；展开的；扁平的</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">希腊语：plateîa hodós → plateîa</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">宽阔的路 → 省去“路”的名词用法</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语：platēa</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">宽街；开敞空间</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">法语：place → desplacer / déplacer</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">位置 → 移离原位</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：displace</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">移开；使离开；取代</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：displaced</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">已离开原位；被迫离开家园的</text>
</svg>