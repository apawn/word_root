<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>confusingly：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：fundere；分词 fūsus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">倾倒、流出；熔化后浇铸</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：con- + fundere → confundere</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">倒到一起 → 混杂、弄乱</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语 confūsus → 古法语 confus</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">混在一起的；困惑、混乱的</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">中古英语：confused</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">加 -ed 的分词形式；早于常用动词 confuse</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语逆构：confuse</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">从较早的 confused 推回动词形式</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：confusing → confusingly</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">让人困惑的 → 以这种方式</text>
</svg>