<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="774" viewBox="0 0 1000 774" role="img">
<title>uncontrolled：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="772" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：rota</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">轮子；像轮子一样的圆形</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：rotula / rotulus；中古拉丁语 rotulus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">小轮；卷起来的文书、卷轴</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">中古拉丁语：contra- + rotulus → contrārotulus</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">用于对照核查的另一份登记卷</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">盎格鲁法语：contreroller；中古英语：countrollen</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">核对账目；监督</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：control</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">控制、管理；约束</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：controlled</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">受控制的</text>
<text class="note" x="500" y="637" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="666" text-anchor="middle" font-size="25" font-weight="600">英语：uncontrolled</text>
<text class="note" x="500" y="702" text-anchor="middle" font-size="20">未受控制、未被约束的</text>
</svg>