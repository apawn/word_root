<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>inventory：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：venīre</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">来；来到某处</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：invenīre → inventus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">来到、遇到 → 发现、想出</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">晚期拉丁语：inventārium → 中世纪 inventōrium</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">清点发现的物品清单</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">借入途径：古法语 inventoire 或直接借拉丁语</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">都指列出已查出的物品</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">中古英语：inventorie → 英语 inventory</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">清单；库存；清点</text>
</svg>