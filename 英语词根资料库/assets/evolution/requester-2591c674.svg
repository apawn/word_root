<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>requester：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：quaerere；分词 quaesitus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">寻找；询问；设法得到</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：re- + quaerere → requirere；分词 requisitus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">寻求；提出需要、要求</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语 requisita → 通俗拉丁语 *requaesita</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">被请求的事物；星号为重构形式</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">古法语 requeste → 中古英语 requeste</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">请求</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：request</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">名词请求；动词由名词转用或法语 requester 传入</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：requester</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">发出请求的一方</text>
</svg>