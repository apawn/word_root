<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>calendar：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：calāre</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">呼叫；正式宣布</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：calendae / kalendae</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">罗马历每月第一天，与正式宣布日期的传统有关</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语 calendārium → 古法语 calendier</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">按月记账的簿册 → 日期、事项清单</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：calendar</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">历法；日历、日程表</text>
</svg>