<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>lectureship：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：legere（legō）</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">挑选；收集；阅读</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：lēctus → 中世纪拉丁语 lēctūra</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">读 → 阅读</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">中古英语及英语：lecture</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">阅读、宣读 → 讲课；训话</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：lectureship</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">讲授工作的职位；讲座安排</text>
</svg>