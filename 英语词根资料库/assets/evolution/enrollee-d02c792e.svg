<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>enrollee：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：rota</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">轮子；像轮子一样的圆形</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：rotula / rotulus；中古拉丁语 rotulus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">小轮；卷起来的文书、卷轴</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">盎格鲁法语：en- + rolle → enroller</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">把名字列入登记卷</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">中古英语：enrollen；英语：enroll / enrol</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">登记、报名、招收</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：enrollee</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">已报名、已注册的人</text>
</svg>