<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>denatured：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：nāscī（nāscor）→ nātus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">出生、生长 → 已出生的</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：nātūra</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">出生；天生的构成与性质</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语：nature</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">本性；自然</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">法语：dénaturer</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">改变本来性质</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：denature</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">使变性；改变本来性质</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：denatured</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">原有结构或用途已被改变的</text>
</svg>