<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="462" viewBox="0 0 1000 462" role="img">
<title>indictment：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="460" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：dīcere / dictus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">说；说出的</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">古法语：enditer → enditement</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">正式指控 → 指控的行为或文件</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">中古英语：endytement</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">控告</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：indictment</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">拼写加 c；读音仍无 /k/</text>
</svg>