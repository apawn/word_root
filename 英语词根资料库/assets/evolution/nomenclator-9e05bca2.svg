<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="254" viewBox="0 0 1000 254" role="img">
<title>nomenclator：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="252" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语构件：nōmen + calātor</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">名字 + 呼叫、通报的人</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：nōmenclātor → 英语 nomenclator</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">报姓名的侍从 → 命名者</text>
</svg>