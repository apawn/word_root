<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670" role="img">
<title>comptroller：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="668" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：rota</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">轮子；像轮子一样的圆形</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：rotula / rotulus；中古拉丁语 rotulus</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">小轮；卷起来的文书、卷轴</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">中古拉丁语：contra- + rotulus → contrārotulus</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">用于对照核查的另一份登记卷</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">盎格鲁法语：contrerolleour；中古英语：countreroller</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">检查账目、负责监督的官员</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">中古英语：compteroller（受 compte“账目”影响的拼写）</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">查账、管理财务的官员</text>
<text class="note" x="500" y="533" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="562" text-anchor="middle" font-size="25" font-weight="600">英语：comptroller</text>
<text class="note" x="500" y="598" text-anchor="middle" font-size="20">财务主管；部分读音仍同 controller</text>
</svg>