<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="358" viewBox="0 0 1000 358" role="img">
<title>refuse：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="356" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">古法语：refuser</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">拒绝；更深来源有不同分析</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">两支：动词借入；refus / refusé 等名词化形式</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">拒绝行为；被弃置的东西</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">英语：refuse</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">动词后重音 /z/；垃圾名词前重音 /s/</text>
</svg>