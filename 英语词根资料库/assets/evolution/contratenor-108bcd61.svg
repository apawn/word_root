<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>contratenor：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：tenēre（teneō）；分词 tentus</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">握住、持有、保持</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：tenor</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">保持的路线、延续；持续的内容</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">中古拉丁语：contra + tenor → contratenor</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">与 tenor 相对配置的声部</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">意大利语：contratenore</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">相对配置的声部名称</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：contratenor</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">历史复调声部名；countertenor 的相关形式</text>
</svg>