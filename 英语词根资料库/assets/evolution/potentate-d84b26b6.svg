<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>potentate：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：potis</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">有能力的；有支配力量的</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：potis + esse → posse</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">有能力 + 是 → 能够</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">拉丁语：potens → potentatus</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">有力量的 → 权力、统治；后期也指统治者</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">古法语 potentat 及直接拉丁借入 → 中古英语 potentat</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">掌权的君主</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：potentate</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">权势显赫的统治者或人物</text>
</svg>