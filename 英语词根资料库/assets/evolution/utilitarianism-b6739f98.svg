<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="566" viewBox="0 0 1000 566" role="img">
<title>utilitarianism：词形演化</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="998" height="564" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="500" y="42" text-anchor="middle" font-size="25" font-weight="600">拉丁语：ūtī（词典形式 ūtor）</text>
<text class="note" x="500" y="78" text-anchor="middle" font-size="20">使用；利用</text>
<text class="note" x="500" y="117" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="146" text-anchor="middle" font-size="25" font-weight="600">拉丁语：ūtilis → ūtilitās</text>
<text class="note" x="500" y="182" text-anchor="middle" font-size="20">有用的 → 用处</text>
<text class="note" x="500" y="221" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="250" text-anchor="middle" font-size="25" font-weight="600">古法语：utilite</text>
<text class="note" x="500" y="286" text-anchor="middle" font-size="20">用处；利益</text>
<text class="note" x="500" y="325" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="354" text-anchor="middle" font-size="25" font-weight="600">英语：utility</text>
<text class="note" x="500" y="390" text-anchor="middle" font-size="20">实用性；公用服务；工具程序</text>
<text class="note" x="500" y="429" text-anchor="middle" font-size="29">↓</text>
<text x="500" y="458" text-anchor="middle" font-size="25" font-weight="600">英语：utilitarian → utilitarianism</text>
<text class="note" x="500" y="494" text-anchor="middle" font-size="20">重视总体效用的 → 功利主义理论</text>
</svg>