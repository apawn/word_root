<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>nect-, nex-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">NECT / NEX = TIE, CONNECT</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">在两个点之间接线；再把多个点连成网</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">接起来与连通</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">connect · connection ·</text>
<text class="note" x="200" y="281" text-anchor="middle" font-size="19">connected · connectivity</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">负责连接的部分</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">connector · connective</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">断开与重连</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">disconnect · disconnection ·</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">reconnect</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">连成网络</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">interconnect · interconnected ·</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">nexus</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">附接与并入</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">annex · annexation ·</text>
<text class="note" x="600" y="431" text-anchor="middle" font-size="19">deannexation</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">旧式或专业词形</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">connexion · annexion ·</text>
<text class="note" x="1000" y="431" text-anchor="middle" font-size="19">annectent · adnexum</text>
</svg>