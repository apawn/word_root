<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>un-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">UN / UNI = ONE</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">数一个 → 几个合成一体 → 全体形成共同范围</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">只有一个</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">unit · unique · unicycle ·</text>
<text class="note" x="200" y="281" text-anchor="middle" font-size="19">unicorn</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">合成一个整体</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">unite · union · unity · unify</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">全体形成一个范围</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">universe · universal ·</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">university</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">样式、声音与心意一致</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">uniform · unison · unanimous</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">重新联合或失去联合</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">reunion · reunify · disunity ·</text>
<text class="note" x="600" y="431" text-anchor="middle" font-size="19">disunite</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">专业领域里的“一”</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">unary · unicellular ·</text>
<text class="note" x="1000" y="431" text-anchor="middle" font-size="19">unilateral · unipolar</text>
</svg>