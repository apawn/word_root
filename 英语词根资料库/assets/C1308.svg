<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>sent-, sens-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">SENT / SENS = FEEL, PERCEIVE</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">信息进来引起感受，再形成理解、态度和判断</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">感知与设备</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">sense · sensory · sensor ·</text>
<text class="note" x="200" y="281" text-anchor="middle" font-size="19">scent</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">敏锐与明智分开</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">sensitive · sensible ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">sensibility</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">强烈感受与轰动</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">sensation · sensational</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">想法合拢或分开</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">consent · consensus · assent ·</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">dissent</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">内心情绪与态度</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">sentiment · sentimental ·</text>
<text class="note" x="600" y="431" text-anchor="middle" font-size="19">resentment</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">感受与判断的特殊去向</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">sentient · sentence · antisense</text>
</svg>