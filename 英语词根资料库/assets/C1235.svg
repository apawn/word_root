<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img">
<title>rot-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="663" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">ROT = WHEEL, TURN</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">一个轮子 → 圆形、转动 → 卷起来的纸 → 名单、台词、核账与控制</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">轮子转起来</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">rotate · rotation · rotary ·</text>
<text class="note" x="200" y="281" text-anchor="middle" font-size="19">rotor</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">轮流完成一圈</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">rota · rolling · rotational</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">圆的形状</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">round · rounded · rotund ·</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">rotunda</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">卷纸变成名册</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">roll · enroll · enrollment ·</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">enrollee</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">台词卷变成职责</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">role · multirole</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">对照账册、监督</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">control · controller ·</text>
<text class="note" x="1000" y="431" text-anchor="middle" font-size="19">comptroller</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">圆圈与反复回返</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">rondo · rondeau · rondel ·</text>
<text class="note" x="200" y="581" text-anchor="middle" font-size="19">roundelay</text>
<text x="600" y="515" text-anchor="middle" font-size="26" font-weight="600">按轮状外形命名</text>
<text class="note" x="600" y="555" text-anchor="middle" font-size="19">rotavirus · rotifer · rotelle ·</text>
<text class="note" x="600" y="581" text-anchor="middle" font-size="19">rotiform</text>
</svg>