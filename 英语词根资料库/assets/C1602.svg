<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="884" viewBox="0 0 1200 884" role="img">
<title>val-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="882" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">一个人有力气，一件事站得住，一样东西值得重视：都从“有力量、能起</text>
<text x="600" y="100" text-anchor="middle" font-size="31" font-weight="600">作用”展开。</text>
<text class="note" x="600" y="141" text-anchor="middle" font-size="22">想象一只手在试分量：摸到一件有用的工具，想到 value；拿起一张仍能使用的票，想到 valid；感到</text>
<text class="note" x="600" y="172" text-anchor="middle" font-size="22">病后的身体重新有力，想到 convalesce。</text>
<text class="note" x="600" y="224" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="284" text-anchor="middle" font-size="26" font-weight="600">价值与重视</text>
<text class="note" x="200" y="324" text-anchor="middle" font-size="19">value, valuable, invaluable,</text>
<text class="note" x="200" y="350" text-anchor="middle" font-size="19">valuation, valuer</text>
<text x="600" y="284" text-anchor="middle" font-size="26" font-weight="600">重新或错误估价</text>
<text class="note" x="600" y="324" text-anchor="middle" font-size="19">undervalue, overvalue, devalue,</text>
<text class="note" x="600" y="350" text-anchor="middle" font-size="19">revalue, evaluate</text>
<text x="1000" y="284" text-anchor="middle" font-size="26" font-weight="600">能派上用场</text>
<text class="note" x="1000" y="324" text-anchor="middle" font-size="19">avail, available, availability,</text>
<text class="note" x="1000" y="350" text-anchor="middle" font-size="19">unavailing</text>
<text x="200" y="434" text-anchor="middle" font-size="26" font-weight="600">站得住、有效</text>
<text class="note" x="200" y="474" text-anchor="middle" font-size="19">valid, validity, validate,</text>
<text class="note" x="200" y="500" text-anchor="middle" font-size="19">invalid, invalidate</text>
<text x="600" y="434" text-anchor="middle" font-size="26" font-weight="600">相等的力量或价值</text>
<text class="note" x="600" y="474" text-anchor="middle" font-size="19">equivalent, equivalence,</text>
<text class="note" x="600" y="500" text-anchor="middle" font-size="19">equivalency, eigenvalue</text>
<text x="1000" y="434" text-anchor="middle" font-size="26" font-weight="600">占上风与广泛存在</text>
<text class="note" x="1000" y="474" text-anchor="middle" font-size="19">prevail, prevailing, prevalent,</text>
<text class="note" x="1000" y="500" text-anchor="middle" font-size="19">prevalence</text>
<text x="200" y="584" text-anchor="middle" font-size="26" font-weight="600">勇气与恢复力量</text>
<text class="note" x="200" y="624" text-anchor="middle" font-size="19">valiant, valor, convalesce,</text>
<text class="note" x="200" y="650" text-anchor="middle" font-size="19">convalescence</text>
<text x="600" y="584" text-anchor="middle" font-size="26" font-weight="600">相反的力量与感受</text>
<text class="note" x="600" y="624" text-anchor="middle" font-size="19">countervail, countervailing,</text>
<text class="note" x="600" y="650" text-anchor="middle" font-size="19">ambivalence, ambivalent</text>
<text x="1000" y="584" text-anchor="middle" font-size="26" font-weight="600">结合能力与科学术语</text>
<text class="note" x="1000" y="624" text-anchor="middle" font-size="19">valence, valency, covalent,</text>
<text class="note" x="1000" y="650" text-anchor="middle" font-size="19">divalent, multivalent</text>
<text x="200" y="734" text-anchor="middle" font-size="26" font-weight="600">愿你安好的告别</text>
<text class="note" x="200" y="774" text-anchor="middle" font-size="19">valediction, valedictory,</text>
<text class="note" x="200" y="800" text-anchor="middle" font-size="19">valedictorian</text>
</svg>