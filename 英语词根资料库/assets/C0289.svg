<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img">
<title>curr-, curs-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="663" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">CURR / CURS = RUN</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">沿路线往前跑；跑回来、一起跑、跑入某事，会产生不同词义</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">路线与学习进程</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">course · coursework ·</text>
<text class="note" x="200" y="281" text-anchor="middle" font-size="19">curriculum</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">流动与通行</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">current · currency ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">undercurrent</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">发生与复现</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">occur · occurrence · recur</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">汇合与同时推进</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">concur · concurrent ·</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">concurrency</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">跑向各处</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">incur · excursion · discourse</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">跑动的笔尖和标记</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">cursor · cursive · cursory</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">规则回到自身</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">recursion · recursive ·</text>
<text class="note" x="200" y="581" text-anchor="middle" font-size="19">recursively</text>
</svg>