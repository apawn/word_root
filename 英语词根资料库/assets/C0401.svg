<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img">
<title>fac-, fact-, -fect-, -fic- (FAC)：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="663" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">FAC = DO / MAKE</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">把东西做出来，把事情做成，让某物变成一种状态</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">做成的事</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">fact · feat · artifact</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">把结果做出来</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">effect · efficient · perfect</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">使事情好做、做得够</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">facility · facilitate ·</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">feasible · sufficient</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">制造与调整</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">manufacture · modify · fashion</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">向前推进、得到收益</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">profit · proficient · benefit</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">担任职责</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">office · official · prefect</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">使成为某种状态</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">qualify · unification · rarefy</text>
<text x="600" y="515" text-anchor="middle" font-size="26" font-weight="600">面与外形：可能相关的旁支</text>
<text class="note" x="600" y="555" text-anchor="middle" font-size="19">face · facet · surface ·</text>
<text class="note" x="600" y="581" text-anchor="middle" font-size="19">interface</text>
</svg>