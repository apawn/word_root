<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img">
<title>par-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="663" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">PAR：把事情安排到位，把东西备好</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">出发前把工具摆好；坏了重新弄好；把混在一起的东西分开安置</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">先把所需的备好</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">prepare · prepared ·</text>
<text class="note" x="200" y="281" text-anchor="middle" font-size="19">preparation · preparatory</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">重新恢复到可用</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">repair · reparable · reparation</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">· disrepair</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">分开安置、各自独立</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">separate · separation · several</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">· inseparable</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">把原来的联系切断</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">sever · severance · dissever</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">从安排到命令、统治</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">imperative · emperor · empire ·</text>
<text class="note" x="600" y="431" text-anchor="middle" font-size="19">imperial</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">备好器具、整理外观</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">apparatus · apparat · pare ·</text>
<text class="note" x="1000" y="431" text-anchor="middle" font-size="19">parure</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">展示、格挡、准备坯料</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">parade · parry · parison</text>
<text x="600" y="515" text-anchor="middle" font-size="26" font-weight="600">提出过失、猛烈责斥</text>
<text class="note" x="600" y="555" text-anchor="middle" font-size="19">vituperate · vituperation ·</text>
<text class="note" x="600" y="581" text-anchor="middle" font-size="19">vituperative</text>
</svg>