<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>cur-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">CUR = CARE</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">把注意力放在一件事上，认真照料它</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">照护与处理</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">cure · curable · curative</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">认真与准确</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">accurate · accuracy</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">关注与好奇</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">curious · curiosity · curio</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">照管与策展</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">curator · curate · curatorial</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">安心与保障</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">sure · secure · insurance</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">代为操办</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">procure · proctor · proxy</text>
</svg>