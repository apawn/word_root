<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>st-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">ST / STAT / STIT = STAND</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">站在一个位置，保持住，再使事情立起来</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">状态与位置</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">state · status · station</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">稳住与建立</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">stable · constant · establish</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">相对站位</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">distance · contrast · obstacle</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">组成与替换</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">constitute · consist ·</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">substitute</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">实质与证据</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">substance · substantive ·</text>
<text class="note" x="600" y="431" text-anchor="middle" font-size="19">substantiate</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">从国家到数据</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">state · statistics · statistic</text>
</svg>