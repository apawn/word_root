<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img">
<title>hab-, -hib-, habit-, -hibit-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="663" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">HAB / HIB = HAVE · HOLD</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">先想“手里拿着、自己保持着”，再看拿出来、按住、住下来几条方向</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">合用 → 有能力</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">able · ability · enable</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">重新恢复能力</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">rehabilitate · rehabilitation ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">rehab</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">保持的状态 → 习惯</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">habit · habitual · habituation</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">常住 → 居住环境</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">inhabit · habitat · habitable</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">欠着 → 应当交付</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">debt · debit · due · duty</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">拿出来 → 呈现</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">exhibit · exhibition</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">按住、挡住 → 限制</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">inhibit · prohibit</text>
<text x="600" y="515" text-anchor="middle" font-size="26" font-weight="600">供给生活所需</text>
<text class="note" x="600" y="555" text-anchor="middle" font-size="19">prebend · provender</text>
</svg>