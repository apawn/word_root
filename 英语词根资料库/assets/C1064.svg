<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="696" viewBox="0 0 1200 696" role="img">
<title>ple-, plet-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="694" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">把少的那一块补上，让数量、内容或任务达到应有的完整程度。</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">想象一张还有空格的清单：全填好是 complete；把缺的物资送来是 supply；再加材料是 supplement；</text>
<text class="note" x="600" y="134" text-anchor="middle" font-size="22">存量被抽走则是 deplete。</text>
<text class="note" x="600" y="186" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="246" text-anchor="middle" font-size="26" font-weight="600">把事情做完整</text>
<text class="note" x="200" y="286" text-anchor="middle" font-size="19">complete, completion,</text>
<text class="note" x="200" y="312" text-anchor="middle" font-size="19">accomplish, accomplishment</text>
<text x="600" y="246" text-anchor="middle" font-size="26" font-weight="600">补足整体、相互搭配</text>
<text class="note" x="600" y="286" text-anchor="middle" font-size="19">complement, complementary</text>
<text x="1000" y="246" text-anchor="middle" font-size="26" font-weight="600">履行礼节、表达赞美</text>
<text class="note" x="1000" y="286" text-anchor="middle" font-size="19">compliment, complimentary</text>
<text x="200" y="396" text-anchor="middle" font-size="26" font-weight="600">履行并实施</text>
<text class="note" x="200" y="436" text-anchor="middle" font-size="19">implement, implementation</text>
<text x="600" y="396" text-anchor="middle" font-size="26" font-weight="600">供应与额外补充</text>
<text class="note" x="600" y="436" text-anchor="middle" font-size="19">supply, supplier, supplement,</text>
<text class="note" x="600" y="462" text-anchor="middle" font-size="19">supplementary</text>
<text x="1000" y="396" text-anchor="middle" font-size="26" font-weight="600">按要求做足</text>
<text class="note" x="1000" y="436" text-anchor="middle" font-size="19">comply, compliance, compliant</text>
<text x="200" y="546" text-anchor="middle" font-size="26" font-weight="600">填满与消耗</text>
<text class="note" x="200" y="586" text-anchor="middle" font-size="19">replete, repletion, deplete,</text>
<text class="note" x="200" y="612" text-anchor="middle" font-size="19">depletion</text>
<text x="600" y="546" text-anchor="middle" font-size="26" font-weight="600">特殊位置的填充</text>
<text class="note" x="600" y="586" text-anchor="middle" font-size="19">suppletion, suppletive,</text>
<text class="note" x="600" y="612" text-anchor="middle" font-size="19">expletive, compline</text>
</svg>