<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img">
<title>scrib-, script-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="663" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">SCRIB / SCRIPT = WRITE</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">把内容写出来：写在下面、写在前面、写到另一处</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">用文字画出来</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">describe · description</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">在下面签认</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">subscribe · subscriber ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">subscription</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">事先写明要求</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">prescribe · prescription ·</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">prescriber</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">写成可使用的文本</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">script · manuscript ·</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">typescript</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">换一种方式记录</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">transcribe · transcript ·</text>
<text class="note" x="600" y="431" text-anchor="middle" font-size="19">transcription</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">把字留在载体上</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">inscribe · inscription</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">写出归属或界限</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">ascribe · circumscribe</text>
</svg>