<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>serv-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">SERV = SERVE / KEEP</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">替人办事是一支，把东西守住、留好是另一支</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">提供与效力</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">serve · service · server</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">服侍与从属</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">servant · servile · subservient</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">服务支线的变化</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">deserve · dessert · sergeant</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">保存与预留</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">preserve · reserve ·</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">reservation</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">节约与保持</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">conserve · conservation ·</text>
<text class="note" x="600" y="431" text-anchor="middle" font-size="19">conservative</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">留心与遵守</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">observe · observation ·</text>
<text class="note" x="1000" y="431" text-anchor="middle" font-size="19">observance</text>
</svg>