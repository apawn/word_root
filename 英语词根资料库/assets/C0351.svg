<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img">
<title>duc-, duct-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="663" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">DUC / DUCT = LEAD</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">同一个“带”的动作，换个方向就长出不同意思</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">把东西带出来</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">produce · product · production</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">把新人、新物带进来</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">introduce · introduction ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">induction</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">把程度往回调</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">reduce · reduction · reducible</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">带着过程进行</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">conduct · conductor ·</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">conduction</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">把推理引向结论</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">deduce · deduction · adduce</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">离开原路或中线</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">seduce · abduct · abduction</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">培养与教育</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">educate · education · educator</text>
</svg>