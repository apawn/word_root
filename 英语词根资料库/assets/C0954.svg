<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img">
<title>pan-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="663" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">PAN = BREAD</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">一块面包：可以拿来吃，也可以与别人分着吃</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">人与人相伴</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">companion, company</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">陪同与伴奏</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">accompany, accompaniment</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">相处的感觉</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">companionship, companionable</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">公司间或内部</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">intercompany, intracompany</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">储放与搬运</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">pantry, pannier</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">食物名字</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">panini, panettone, panko</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">把面包做成糊</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">panada, panade</text>
<text x="600" y="515" text-anchor="middle" font-size="26" font-weight="600">提供生计</text>
<text class="note" x="600" y="555" text-anchor="middle" font-size="19">appanage</text>
<text x="1000" y="515" text-anchor="middle" font-size="26" font-weight="600">少见专业词</text>
<text class="note" x="1000" y="555" text-anchor="middle" font-size="19">impanation, panivorous</text>
</svg>