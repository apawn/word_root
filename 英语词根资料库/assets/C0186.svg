<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>caus-, -cus-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">CAUS = CAUSE / CASE</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">追问“为什么”，再走到“凭什么怪他”</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">说明原因</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">cause · because</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">讨论因果</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">causal · causation · causality</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">提出指控</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">accuse · accusation · accuser</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">受到指控</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">accused</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">解除责怪</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">excuse</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">语法中的特殊历史</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">accusative</text>
</svg>