<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img">
<title>sed-, -sid-, sess-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="663" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">SED / SID / SESS = SIT</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">想象坐下来这个动作：坐在前面能主持，坐着留下能居住，东西向下落定能沉积，坐守在周围也能围困。</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">坐在前面主持</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">preside / president /</text>
<text class="note" x="200" y="281" text-anchor="middle" font-size="19">presidency / presidential</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">留下来居住</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">reside / resident / residence /</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">residency / residential</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">坐定办事、分开持异议</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">session / sitting；dissident /</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">dissidence</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">沉下来或平息</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">sediment / sedimentary /</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">subside / subsidence / sedate</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">坐守、包围、占有</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">obsess / obsession / insidious；</text>
<text class="note" x="600" y="431" text-anchor="middle" font-size="19">possess / possession</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">坐在旁边认真做事</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">assess / assessment / assessor；</text>
<text class="note" x="1000" y="431" text-anchor="middle" font-size="19">assiduous / assiduity</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">后援与残留</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">subsidy / subsidiary；residue /</text>
<text class="note" x="200" y="581" text-anchor="middle" font-size="19">residual</text>
<text x="600" y="515" text-anchor="middle" font-size="26" font-weight="600">日耳曼语平行亲属</text>
<text class="note" x="600" y="555" text-anchor="middle" font-size="19">sit / seat / settle /</text>
<text class="note" x="600" y="581" text-anchor="middle" font-size="19">settlement / resettle</text>
</svg>