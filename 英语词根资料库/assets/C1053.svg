<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>plac-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">PLAC = CALM / APPEASE</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">让紧绷的情绪缓下来，让对方愿意接受</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">使不满缓和</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">placate · placation</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">带着安抚意图</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">placatory · placating ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">placatingly</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">能否被劝和</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">placable · implacable ·</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">implacably</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">平静温和的状态</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">placid · placidly · placidity</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">相关的使满意支线</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">please</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">远源有争议的支线</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">supple · supplicant ·</text>
<text class="note" x="1000" y="431" text-anchor="middle" font-size="19">supplication</text>
</svg>