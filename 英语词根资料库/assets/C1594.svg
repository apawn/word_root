<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>ut-, us-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">UT / US = USE</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">把东西拿来派用场；反复这样做，就成了平常习惯</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">使用与使用者</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">use · user · usage</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">能否帮上忙</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">useful · useless · utility</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">能用与好用</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">usable · usability</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">反复使用成为常态</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">usual · usually · unusual</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">再次用或用得不对</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">reuse · misuse · abuse</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">资源与整体效果</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">utilize · utilization ·</text>
<text class="note" x="1000" y="431" text-anchor="middle" font-size="19">utilitarianism</text>
</svg>