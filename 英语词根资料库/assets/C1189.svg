<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="981" viewBox="0 0 1200 981" role="img">
<title>quer-, -quir-, quesit-, -quisit-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="979" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">QUER / QUIR / QUEST / QUISIT：朝想要的东西找过去</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">手里拿着一个空盒子：想装进答案，就去问；想装进本领或东西，就去获取；面前有阻力，就设法攻克</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">追寻目标与提出问题</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">quest · question · query ·</text>
<text class="note" x="200" y="281" text-anchor="middle" font-size="19">questionnaire</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">怀疑与不加怀疑</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">questionable · questioning ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">unquestionable · unquestioned ·</text>
<text class="note" x="600" y="307" text-anchor="middle" font-size="19">unquestioning</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">询问与求知</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">inquire · enquiry · inquiring ·</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">inquisitive · inquisitiveness</text>
<text x="200" y="381" text-anchor="middle" font-size="26" font-weight="600">正式调查与严厉盘问</text>
<text class="note" x="200" y="421" text-anchor="middle" font-size="19">inquest · inquisition ·</text>
<text class="note" x="200" y="447" text-anchor="middle" font-size="19">inquisitor · inquisitorial</text>
<text x="600" y="381" text-anchor="middle" font-size="26" font-weight="600">获得东西、知识和企业</text>
<text class="note" x="600" y="421" text-anchor="middle" font-size="19">acquire · acquisition ·</text>
<text class="note" x="600" y="447" text-anchor="middle" font-size="19">acquired · acquirer · acquiree</text>
<text x="1000" y="381" text-anchor="middle" font-size="26" font-weight="600">想继续拥有更多</text>
<text class="note" x="1000" y="421" text-anchor="middle" font-size="19">acquisitive · acquisitiveness ·</text>
<text class="note" x="1000" y="447" text-anchor="middle" font-size="19">acquisitory</text>
<text x="200" y="531" text-anchor="middle" font-size="26" font-weight="600">提出请求和必要条件</text>
<text class="note" x="200" y="571" text-anchor="middle" font-size="19">request · require · requirement</text>
<text class="note" x="200" y="597" text-anchor="middle" font-size="19">· requisite</text>
<text x="600" y="531" text-anchor="middle" font-size="26" font-weight="600">先具备或配套具备</text>
<text class="note" x="600" y="571" text-anchor="middle" font-size="19">prerequisite · corequisite</text>
<text x="1000" y="531" text-anchor="middle" font-size="26" font-weight="600">正式调取与申领</text>
<text class="note" x="1000" y="571" text-anchor="middle" font-size="19">requisition · requisitor ·</text>
<text class="note" x="1000" y="597" text-anchor="middle" font-size="19">requisitory</text>
<text x="200" y="681" text-anchor="middle" font-size="26" font-weight="600">努力拿下与重新夺回</text>
<text class="note" x="200" y="721" text-anchor="middle" font-size="19">conquer · conquest · conqueror</text>
<text class="note" x="200" y="747" text-anchor="middle" font-size="19">· reconquer · reconquest</text>
<text x="600" y="681" text-anchor="middle" font-size="26" font-weight="600">仔细挑选到精细程度</text>
<text class="note" x="600" y="721" text-anchor="middle" font-size="19">exquisite · exquisitely ·</text>
<text class="note" x="600" y="747" text-anchor="middle" font-size="19">exquisiteness</text>
<text x="1000" y="681" text-anchor="middle" font-size="26" font-weight="600">取得额外收益</text>
<text class="note" x="1000" y="721" text-anchor="middle" font-size="19">perquisite · perk</text>
<text x="200" y="831" text-anchor="middle" font-size="26" font-weight="600">深入查究与长篇论述</text>
<text class="note" x="200" y="871" text-anchor="middle" font-size="19">perquisition · disquisition</text>
<text x="600" y="831" text-anchor="middle" font-size="26" font-weight="600">保留在旧文献与批注中的词</text>
<text class="note" x="600" y="871" text-anchor="middle" font-size="19">quaere · exquire · acquisite ·</text>
<text class="note" x="600" y="897" text-anchor="middle" font-size="19">quaestor · questor</text>
</svg>