<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="815" viewBox="0 0 1200 815" role="img">
<title>div-, diff-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="813" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">放在一起比较：分成几部分，或走向不同方向。</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">切开的蛋糕、分岔的道路、各不相同的卡片。</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">整体切开</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">divide, division</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">数学中的分</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">dividend, divisor</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">一个完整个体</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">individual, individuality</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">安排出方案</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">devise, device</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">比较出不同</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">differ, difference</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">区分与变化</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">differentiate, differential</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">不再在意差别</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">indifferent, indifference</text>
<text x="600" y="515" text-anchor="middle" font-size="26" font-weight="600">走向不同方向</text>
<text class="note" x="600" y="555" text-anchor="middle" font-size="19">diverge, divergent</text>
<text x="1000" y="515" text-anchor="middle" font-size="26" font-weight="600">类型丰富</text>
<text class="note" x="1000" y="555" text-anchor="middle" font-size="19">diverse, biodiversity</text>
<text x="200" y="665" text-anchor="middle" font-size="26" font-weight="600">数学中的平顺对应</text>
<text class="note" x="200" y="705" text-anchor="middle" font-size="19">diffeomorphism</text>
</svg>