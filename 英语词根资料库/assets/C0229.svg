<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="696" viewBox="0 0 1200 696" role="img">
<title>clam-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="694" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">把一句话或一个要求明确地说出来，让别人听见并回应。</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">同一个人站出来发声：说“这是我的”是 claim；喊“太好了”连到 acclaim；向公众宣布连到 proclaim；</text>
<text class="note" x="600" y="134" text-anchor="middle" font-size="22">惊讶脱口而出连到 exclaim。</text>
<text class="note" x="600" y="186" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="246" text-anchor="middle" font-size="26" font-weight="600">提出权利与说法</text>
<text class="note" x="200" y="286" text-anchor="middle" font-size="19">claim, claimant, counterclaim,</text>
<text class="note" x="200" y="312" text-anchor="middle" font-size="19">unclaimed</text>
<text x="600" y="246" text-anchor="middle" font-size="26" font-weight="600">取回与恢复用途</text>
<text class="note" x="600" y="286" text-anchor="middle" font-size="19">reclaim, reclamation</text>
<text x="1000" y="246" text-anchor="middle" font-size="26" font-weight="600">赞同与好评</text>
<text class="note" x="1000" y="286" text-anchor="middle" font-size="19">acclaim, acclaimed, acclamation</text>
<text x="200" y="396" text-anchor="middle" font-size="26" font-weight="600">惊呼与感叹</text>
<text class="note" x="200" y="436" text-anchor="middle" font-size="19">exclaim, exclamation,</text>
<text class="note" x="200" y="462" text-anchor="middle" font-size="19">exclamatory</text>
<text x="600" y="396" text-anchor="middle" font-size="26" font-weight="600">公开宣告</text>
<text class="note" x="600" y="436" text-anchor="middle" font-size="19">proclaim, proclamation</text>
<text x="1000" y="396" text-anchor="middle" font-size="26" font-weight="600">众声喧哗、强烈呼声</text>
<text class="note" x="1000" y="436" text-anchor="middle" font-size="19">clamor, clamour, clamorous</text>
<text x="200" y="546" text-anchor="middle" font-size="26" font-weight="600">划清责任或主张</text>
<text class="note" x="200" y="586" text-anchor="middle" font-size="19">disclaim, disclaimer</text>
<text x="600" y="546" text-anchor="middle" font-size="26" font-weight="600">演说与朗诵</text>
<text class="note" x="600" y="586" text-anchor="middle" font-size="19">declaim, declamation,</text>
<text class="note" x="600" y="612" text-anchor="middle" font-size="19">declamatory</text>
</svg>