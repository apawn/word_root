<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img">
<title>cred-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="663" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">CRED = BELIEVE, TRUST</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">把信任交出去；再看凭什么值得相信、怎样获得认可</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">信用与认可</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">credit · creditor · creditable</text>
<text class="note" x="200" y="281" text-anchor="middle" font-size="19">· credited</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">值得相信</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">credible · credibility ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">credibly</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">惊人到不敢信</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">incredible · incredibly</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">轻信与怀疑的反应</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">credulous · credulity ·</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">incredulous · incredulity</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">信念与信条</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">credence · creed · credo</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">凭据与正式认可</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">credential · credentials ·</text>
<text class="note" x="1000" y="431" text-anchor="middle" font-size="19">accredit · accreditation</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">信任被损害</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">discredit · discredited</text>
</svg>