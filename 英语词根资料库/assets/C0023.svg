<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>ag-, -ig-, act-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">AG / ACT：让事情动起来、做起来</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">先推动，再行动；人在做事，事情也在起作用</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">做出来的行为</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">act · action · active ·</text>
<text class="note" x="200" y="281" text-anchor="middle" font-size="19">activity</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">谁做、该做什么</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">actor · agent · agenda</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">对别的作用作回应</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">react · interact · counteract</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">启动与停止</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">activation · deactivation ·</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">reactivation</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">推动身体与思想</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">agile · agitate · cogitate</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">把事情办完、走通</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">transaction · navigate · cogent</text>
</svg>