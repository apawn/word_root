<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>cor-, cord-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">COR / CORD = HEART</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">心里有勇气，心意能相合，也能把事情记在心中</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">记在心中</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">record</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">勇气增减</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">courage · encourage ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">discourage</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">心意相合</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">accord · concord · concordance</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">心意不合</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">discord · discordant</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">发自内心的友好</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">cordial · cordially ·</text>
<text class="note" x="600" y="431" text-anchor="middle" font-size="19">cordiality</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">心的外形与怜悯</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">cordate · obcordate ·</text>
<text class="note" x="1000" y="431" text-anchor="middle" font-size="19">misericord</text>
</svg>