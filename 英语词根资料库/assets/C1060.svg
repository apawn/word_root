<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img">
<title>plat-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="663" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">PLAT / PLATY = BROAD / FLAT</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">展开的一片空间，也可以是一片宽而薄的东西</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">宽街、开敞空间</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">place · plaza · piazza</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">位置与安置</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">placement · replace · displace</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">按用途命名的地方</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">workplace · birthplace ·</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">fireplace</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">宽平的物体与台面</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">plate · plateau · platform ·</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">platter</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">形状引出的名称</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">platelet · platypus · platysma</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">平淡、缺少起伏的表达</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">platitude · platitudinous</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">固定重复的内容</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">commonplace · boilerplate</text>
</svg>