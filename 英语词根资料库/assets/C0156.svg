<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="546" viewBox="0 0 1200 546" role="img">
<title>cal-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="544" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">把声音发出去，让人听见、过来，或知道某人某物叫什么。</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">想象一个人在广场上发声：叫大家来议事，连到 council；报出月初与日期，连到 calendar；报来客</text>
<text class="note" x="600" y="134" text-anchor="middle" font-size="22">名字，连到 nomenclature。</text>
<text class="note" x="600" y="186" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="246" text-anchor="middle" font-size="26" font-weight="600">召集议事的人</text>
<text class="note" x="200" y="286" text-anchor="middle" font-size="19">council, councillor,</text>
<text class="note" x="200" y="312" text-anchor="middle" font-size="19">councilmember</text>
<text x="600" y="246" text-anchor="middle" font-size="26" font-weight="600">把关系重新拉到一起</text>
<text class="note" x="600" y="286" text-anchor="middle" font-size="19">conciliate, conciliatory,</text>
<text class="note" x="600" y="312" text-anchor="middle" font-size="19">reconcile, reconciliation</text>
<text x="1000" y="246" text-anchor="middle" font-size="26" font-weight="600">分组、等级与范本</text>
<text class="note" x="1000" y="286" text-anchor="middle" font-size="19">class, classify, classic,</text>
<text class="note" x="1000" y="312" text-anchor="middle" font-size="19">classical</text>
<text x="200" y="396" text-anchor="middle" font-size="26" font-weight="600">宣布日期与置闰</text>
<text class="note" x="200" y="436" text-anchor="middle" font-size="19">calendar, calends, intercalate</text>
<text x="600" y="396" text-anchor="middle" font-size="26" font-weight="600">报名字与命名体系</text>
<text class="note" x="600" y="436" text-anchor="middle" font-size="19">nomenclator, nomenclature</text>
<text x="1000" y="396" text-anchor="middle" font-size="26" font-weight="600">同源的喊出、主张支线</text>
<text class="note" x="1000" y="436" text-anchor="middle" font-size="19">claim, reclaim, acclaim,</text>
<text class="note" x="1000" y="462" text-anchor="middle" font-size="19">proclaim</text>
</svg>