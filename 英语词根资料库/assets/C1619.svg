<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>ver-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">VER = TRUE</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">“这是真的”——可以强调、核实，也可以只是像真</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">把语气说满</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">very · veritable</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">作出判断或断言</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">verdict · aver</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">检查是否属实</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">verify · verifiable</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">真实与如实</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">verity · veracious</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">看起来像真的</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">verisimilitude · verisimilar</text>
</svg>