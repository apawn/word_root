<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="831" viewBox="0 0 1200 831" role="img">
<title>pung-, punct-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="829" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">pungere = 刺、戳；punct- = 同一拉丁动词的另一词干形态</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">一根针落在纸上：动作是“刺”，留下的是“点”，针头本身是“尖端”。</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">点、尖端和指向</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">point, pointed, pointer, pointy,</text>
<text class="note" x="200" y="281" text-anchor="middle" font-size="19">pinpoint</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">位置和观察角度</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">viewpoint, standpoint,</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">checkpoint, endpoint, midpoint,</text>
<text class="note" x="600" y="307" text-anchor="middle" font-size="19">breakpoint</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">缺少目的</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">pointless, pointlessly,</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">pointlessness</text>
<text x="200" y="381" text-anchor="middle" font-size="26" font-weight="600">定下安排，或使期待落空</text>
<text class="note" x="200" y="421" text-anchor="middle" font-size="19">appoint, appointment, appointee,</text>
<text class="note" x="200" y="447" text-anchor="middle" font-size="19">disappoint, disappointment</text>
<text x="600" y="381" text-anchor="middle" font-size="26" font-weight="600">准到一个时间点</text>
<text class="note" x="600" y="421" text-anchor="middle" font-size="19">punctual, punctuality,</text>
<text class="note" x="600" y="447" text-anchor="middle" font-size="19">punctually, unpunctual</text>
<text x="1000" y="381" text-anchor="middle" font-size="26" font-weight="600">文字记号与微小细节</text>
<text class="note" x="1000" y="421" text-anchor="middle" font-size="19">punctuate, punctuation,</text>
<text class="note" x="1000" y="447" text-anchor="middle" font-size="19">punctilio, punctilious</text>
<text x="200" y="531" text-anchor="middle" font-size="26" font-weight="600">刺孔与点状外形</text>
<text class="note" x="200" y="571" text-anchor="middle" font-size="19">puncture, acupuncture, punctate,</text>
<text class="note" x="200" y="597" text-anchor="middle" font-size="19">punctiform</text>
<text x="600" y="531" text-anchor="middle" font-size="26" font-weight="600">鼻舌、情感和良心受到刺激</text>
<text class="note" x="600" y="571" text-anchor="middle" font-size="19">pungent, poignant, compunction</text>
<text x="1000" y="531" text-anchor="middle" font-size="26" font-weight="600">标记删除</text>
<text class="note" x="1000" y="571" text-anchor="middle" font-size="19">expunge, expunction,</text>
<text class="note" x="1000" y="597" text-anchor="middle" font-size="19">expungement</text>
<text x="200" y="681" text-anchor="middle" font-size="26" font-weight="600">工具、击打与扑取</text>
<text class="note" x="200" y="721" text-anchor="middle" font-size="19">punch, puncher, punchy, pounce,</text>
<text class="note" x="200" y="747" text-anchor="middle" font-size="19">puncheon</text>
<text x="600" y="681" text-anchor="middle" font-size="26" font-weight="600">用点画画、用音符配合</text>
<text class="note" x="600" y="721" text-anchor="middle" font-size="19">pointillism, pointillist,</text>
<text class="note" x="600" y="747" text-anchor="middle" font-size="19">counterpoint, contrapuntal</text>
</svg>