<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="884" viewBox="0 0 1200 884" role="img">
<title>vers-, vert-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="882" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">原先朝这一边，现在转向另一边；方向改变，状态、用途和立场也能跟着</text>
<text x="600" y="100" text-anchor="middle" font-size="31" font-weight="600">改变。</text>
<text class="note" x="600" y="141" text-anchor="middle" font-size="22">想象一个可以转动的箭头：转回去是 revert，转开是 avert，转到相反方向是 reverse；让大家转头</text>
<text class="note" x="600" y="172" text-anchor="middle" font-size="22">看向一件事，则连到了 advertise。</text>
<text class="note" x="600" y="224" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="284" text-anchor="middle" font-size="26" font-weight="600">换形式、换说法</text>
<text class="note" x="200" y="324" text-anchor="middle" font-size="19">convert, conversion, version</text>
<text x="600" y="284" text-anchor="middle" font-size="26" font-weight="600">共处到交谈</text>
<text class="note" x="600" y="324" text-anchor="middle" font-size="19">converse, conversation,</text>
<text class="note" x="600" y="350" text-anchor="middle" font-size="19">conversant</text>
<text x="1000" y="284" text-anchor="middle" font-size="26" font-weight="600">朝向、对抗、引起注意</text>
<text class="note" x="1000" y="324" text-anchor="middle" font-size="19">adverse, adversary, advertise</text>
<text x="200" y="434" text-anchor="middle" font-size="26" font-weight="600">转离、转向多种方向</text>
<text class="note" x="200" y="474" text-anchor="middle" font-size="19">avert, aversion, divert,</text>
<text class="note" x="200" y="500" text-anchor="middle" font-size="19">diverse</text>
<text x="600" y="434" text-anchor="middle" font-size="26" font-weight="600">反转、转回与颠覆</text>
<text class="note" x="600" y="474" text-anchor="middle" font-size="19">reverse, revert, invert,</text>
<text class="note" x="600" y="500" text-anchor="middle" font-size="19">subvert, pervert</text>
<text x="1000" y="434" text-anchor="middle" font-size="26" font-weight="600">对立争论</text>
<text class="note" x="1000" y="474" text-anchor="middle" font-size="19">controversy, controversial,</text>
<text class="note" x="1000" y="500" text-anchor="middle" font-size="19">controvert</text>
<text x="200" y="584" text-anchor="middle" font-size="26" font-weight="600">转成文字行与直行表达</text>
<text class="note" x="200" y="624" text-anchor="middle" font-size="19">verse, prose, prosaic</text>
<text x="600" y="584" text-anchor="middle" font-size="26" font-weight="600">整体与每年转回</text>
<text class="note" x="600" y="624" text-anchor="middle" font-size="19">universe, university,</text>
<text class="note" x="600" y="650" text-anchor="middle" font-size="19">anniversary</text>
<text x="1000" y="584" text-anchor="middle" font-size="26" font-weight="600">旋转、头顶、椎骨</text>
<text class="note" x="1000" y="624" text-anchor="middle" font-size="19">vortex, vertex, vertical,</text>
<text class="note" x="1000" y="650" text-anchor="middle" font-size="19">vertigo, vertebra</text>
<text x="200" y="734" text-anchor="middle" font-size="26" font-weight="600">向内、向外</text>
<text class="note" x="200" y="774" text-anchor="middle" font-size="19">introvert, extrovert, ambivert</text>
<text x="600" y="734" text-anchor="middle" font-size="26" font-weight="600">横过与灵活转用</text>
<text class="note" x="600" y="774" text-anchor="middle" font-size="19">transverse, traverse, versatile</text>
</svg>