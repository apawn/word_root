<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="546" viewBox="0 0 1200 546" role="img">
<title>plen-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="544" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">一个容器、一个集合或一份权限已经给足，不再缺少应有的部分。</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">仓库货物充足是 plenty；用掉一些再补回来是 replenish；分组会议重新聚成全体是 plenary；代表</text>
<text class="note" x="600" y="134" text-anchor="middle" font-size="22">的授权给足则是 plenipotentiary。</text>
<text class="note" x="600" y="186" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="246" text-anchor="middle" font-size="26" font-weight="600">日常数量充足</text>
<text class="note" x="200" y="286" text-anchor="middle" font-size="19">plenty, plentiful, aplenty</text>
<text x="600" y="246" text-anchor="middle" font-size="26" font-weight="600">补回存量</text>
<text class="note" x="600" y="286" text-anchor="middle" font-size="19">replenish, replenishment</text>
<text x="1000" y="246" text-anchor="middle" font-size="26" font-weight="600">全体与完整</text>
<text class="note" x="1000" y="286" text-anchor="middle" font-size="19">plenary, plenum</text>
<text x="200" y="396" text-anchor="middle" font-size="26" font-weight="600">书面的丰富、丰盈</text>
<text class="note" x="200" y="436" text-anchor="middle" font-size="19">plenitude, plenteous</text>
<text x="600" y="396" text-anchor="middle" font-size="26" font-weight="600">充分授权</text>
<text class="note" x="600" y="436" text-anchor="middle" font-size="19">plenipotentiary</text>
</svg>