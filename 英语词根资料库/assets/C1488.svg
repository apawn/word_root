<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img">
<title>tend-, tens-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="663" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">TEND / TENS：把某物朝一个方向伸展、拉紧</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">伸手到远处；把绳拉紧；把注意力集中到一个方向</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">向外伸开</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">extend · extension · extensive</text>
<text class="note" x="200" y="281" text-anchor="middle" font-size="19">· extent</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">拉紧与提高强度</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">tense · tension · intense ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">intensify</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">把注意力放过去</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">attend · attention · attentive</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">让心思指向目标</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">intend · intention ·</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">intentional</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">用力争取、坚持</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">contend · contention ·</text>
<text class="note" x="600" y="431" text-anchor="middle" font-size="19">contender</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">摆在前面、展示出来</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">pretend · pretension ·</text>
<text class="note" x="1000" y="431" text-anchor="middle" font-size="19">ostensible · portend</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">从触探到试验、诱惑</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">attempt · tentative · tempt ·</text>
<text class="note" x="200" y="581" text-anchor="middle" font-size="19">tentacle</text>
<text x="600" y="515" text-anchor="middle" font-size="26" font-weight="600">帐篷、拉索与张紧结构</text>
<text class="note" x="600" y="555" text-anchor="middle" font-size="19">tent · tentorium · tendon ·</text>
<text class="note" x="600" y="581" text-anchor="middle" font-size="19">tensor</text>
</svg>