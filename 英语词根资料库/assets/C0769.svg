<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>mov-, mot-, mut-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">MOV / MOT / MUT：位置、状态或关系发生变化</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">让物体动起来；把东西改个样；双方彼此交换</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">位置和运动</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">move · motion · mobile · motor</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">推动事情与人心</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">promote · motive · emotion</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">运动、分量与时间</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">moment · momentum · momentous</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">改变与重新排列</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">mutate · mutable · permute ·</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">transmute</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">交换发展出新用法</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">commute · commutation ·</text>
<text class="note" x="600" y="431" text-anchor="middle" font-size="19">commutative</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">双方相互对应</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">mutual · mutuality · mutualism</text>
</svg>