<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>leg-, lect-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">LEG / LECT：从许多东西中挑出、聚拢</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">挑出物品；聚成一组；从文字与线索中读懂意义</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">聚拢成为一组</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">collect · collection ·</text>
<text class="note" x="200" y="281" text-anchor="middle" font-size="19">collective</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">从中选出</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">select · elect · eligible ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">elite</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">读出与读清</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">lesson · lecture · legible ·</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">legend</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">理解与分辨</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">intellect · intelligent ·</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">intelligible</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">用心与忽略</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">diligent · neglect · negligible</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">另一路：共同任职</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">colleague · college · collegial</text>
</svg>