<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>dic-, dict-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">DIC / DICT = SAY</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">把心里的话说出来，也可以把规矩正式说定</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">提前说结果</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">predict · prediction</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">公开说规矩</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">dictate · edict</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">反着说</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">contradict · contradiction</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">共同说定</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">condition · conditional</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">话语与记录</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">diction · dictionary</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">祝福与告别</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">benediction · valediction</text>
</svg>