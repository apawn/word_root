<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img">
<title>ten-, -tin-, tent-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="663" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">TEN / TIN / TENT = HOLD, KEEP</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">手握住东西 → 留在里面、留在身边 → 维持状态、保持连续</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">把东西留在里面</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">contain · container · content ·</text>
<text class="note" x="200" y="281" text-anchor="middle" font-size="19">containment</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">拿到后继续握住</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">obtain · retain · retention ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">retainer</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">把状态撑住</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">maintain · maintenance ·</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">sustain · sustainable</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">让前后相接</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">continue · continuous ·</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">continual · continuity</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">握有房屋、土地或职位</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">tenant · tenancy · tenure ·</text>
<text class="note" x="600" y="431" text-anchor="middle" font-size="19">lieutenant</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">把自己控制住</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">abstain · abstinence ·</text>
<text class="note" x="1000" y="431" text-anchor="middle" font-size="19">continence · incontinence</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">紧抓目标或关联</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">tenacious · tenet · pertain ·</text>
<text class="note" x="200" y="581" text-anchor="middle" font-size="19">pertinent</text>
<text x="600" y="515" text-anchor="middle" font-size="26" font-weight="600">历史上保留下来的特殊支线</text>
<text class="note" x="600" y="555" text-anchor="middle" font-size="19">countenance · entertain · tenor</text>
<text class="note" x="600" y="581" text-anchor="middle" font-size="19">· tenuto</text>
</svg>