<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="965" viewBox="0 0 1200 965" role="img">
<title>cad-, -cid-, cas-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="963" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">CAD / CID / CAS = FALL</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">先看一片叶子落下，再看一件事落到自己头上：一个是下落，一个是发生</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">事情落到头上 → 发生</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">accident · incident · incidence</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">落成某种情况 → 个案</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">case · casuist · casuistry</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">结果未定 → 偶然、机会</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">chance · chancy · occasion</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">偶然、临时 → 不郑重</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">casual · casually</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">不幸事件 → 受损者</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">casualty</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">一起落在同处 → 重合</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">coincide · coincidence</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">逐渐下落 → 衰败</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">decay · decadence · decadent</text>
<text x="600" y="515" text-anchor="middle" font-size="26" font-weight="600">水往下落；防护下落</text>
<text class="note" x="600" y="555" text-anchor="middle" font-size="19">cascade · chute · parachute</text>
<text x="1000" y="515" text-anchor="middle" font-size="26" font-weight="600">声音落定 → 节奏、收束</text>
<text class="note" x="1000" y="555" text-anchor="middle" font-size="19">cadence · cadenza · cadential</text>
<text x="200" y="665" text-anchor="middle" font-size="26" font-weight="600">到了阶段落掉</text>
<text class="note" x="200" y="705" text-anchor="middle" font-size="19">deciduous · decidua · caducous</text>
<text x="600" y="665" text-anchor="middle" font-size="26" font-weight="600">财产落回去 → 旧法律分支</text>
<text class="note" x="600" y="705" text-anchor="middle" font-size="19">escheat · escheator · cheat</text>
<text x="1000" y="665" text-anchor="middle" font-size="26" font-weight="600">又落回原状 → 重犯、复发</text>
<text class="note" x="1000" y="705" text-anchor="middle" font-size="19">recidivist · recidivism ·</text>
<text class="note" x="1000" y="731" text-anchor="middle" font-size="19">recidivous</text>
<text x="200" y="815" text-anchor="middle" font-size="26" font-weight="600">太阳落下的一方 → 西方</text>
<text class="note" x="200" y="855" text-anchor="middle" font-size="19">occident · occidental</text>
</svg>