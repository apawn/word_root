<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="681" viewBox="0 0 1200 681" role="img">
<title>poli-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="679" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">POLI = CITY / CITIZEN / PUBLIC LIFE</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">人聚成一座城 → 成为共同体的公民 → 一起决定公共事务怎么管</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">公共事务与政治参与</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">politics · political ·</text>
<text class="note" x="200" y="281" text-anchor="middle" font-size="19">politician · politicize</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">采取什么方针</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">policy · policymaker ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">policymaking</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">维持秩序、执行规则</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">police · policing · policeman ·</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">policewoman</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">怎样组织共同体</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">polity · politeia · isopolity</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">怎样判断局面</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">politic · impolitic</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">城市中心与城市规模</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">metropolis · metropolitan ·</text>
<text class="note" x="1000" y="431" text-anchor="middle" font-size="19">megalopolis</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">跨地域的文化和身份</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">cosmopolitan · cosmopolite ·</text>
<text class="note" x="200" y="581" text-anchor="middle" font-size="19">cosmopolitanism</text>
<text x="600" y="515" text-anchor="middle" font-size="26" font-weight="600">数一组城有几座</text>
<text class="note" x="600" y="555" text-anchor="middle" font-size="19">tetrapolis · pentapolis ·</text>
<text class="note" x="600" y="581" text-anchor="middle" font-size="19">hexapolis · heptapolis ·</text>
<text class="note" x="600" y="607" text-anchor="middle" font-size="19">Decapolis</text>
</svg>