<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="815" viewBox="0 0 1200 815" role="img">
<title>ven-, vent-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="813" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">VEN / VENT = COME</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">把“来”画成一个箭头：从哪里来、往哪里来、何时来，决定后面的意思</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">来到、发生</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">advent · event · eventual</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">将会遇到的事 → 冒险</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">adventure · venture</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">来往的路、来到的地点</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">avenue · venue</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">回来的钱 → 收入</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">revenue</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">一起到来 → 会合、约定</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">convene · convention · covenant</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">彼此相合 → 方便</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">convenient · convenience</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">先来到 → 预防</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">prevent · prevention</text>
<text x="600" y="515" text-anchor="middle" font-size="26" font-weight="600">来到、遇到 → 发现、发明</text>
<text class="note" x="600" y="555" text-anchor="middle" font-size="19">invent · invention · inventory</text>
<text x="1000" y="515" text-anchor="middle" font-size="26" font-weight="600">来到中间 → 介入</text>
<text class="note" x="1000" y="555" text-anchor="middle" font-size="19">intervene · intervention</text>
<text x="200" y="665" text-anchor="middle" font-size="26" font-weight="600">从四周来、反向来</text>
<text class="note" x="200" y="705" text-anchor="middle" font-size="19">circumvent · contravene</text>
<text x="600" y="665" text-anchor="middle" font-size="26" font-weight="600">来到心中 → 纪念品</text>
<text class="note" x="600" y="705" text-anchor="middle" font-size="19">souvenir</text>
</svg>