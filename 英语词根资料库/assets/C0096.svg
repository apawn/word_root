<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="515" viewBox="0 0 1200 515" role="img">
<title>aud-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="513" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">AUD = HEAR</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">声音进入耳朵；听者接收、理解，有时还要判断</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">声音能否听见</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">audible · inaudible · audibly</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">听与看的受众、场所</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">audience · auditorium</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">声音内容与设备</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">audio · audiobook · audiotape ·</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">audiovisual</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">听觉研究与人员</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">auditory · audiology ·</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">audiologist</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">听取后核查或评选</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">audit · auditor · audition</text>
</svg>