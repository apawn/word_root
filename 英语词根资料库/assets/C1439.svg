<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="815" viewBox="0 0 1200 815" role="img">
<title>stru-, struct-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="813" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">STRU / STRUCT：把零散部分按顺序搭成整体</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">把砖块搭成墙；在前面砌墙挡路；把搭好的墙拆开</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">把部分搭成整体</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">construct · construction ·</text>
<text class="note" x="200" y="281" text-anchor="middle" font-size="19">constructor</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">把话语、线索拼成理解</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">construe · construal ·</text>
<text class="note" x="600" y="281" text-anchor="middle" font-size="19">misconstrue · misconstruction</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">帮助把事情做好</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">constructive · constructively ·</text>
<text class="note" x="1000" y="281" text-anchor="middle" font-size="19">constructiveness</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">整体如何组织</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">structure · structural ·</text>
<text class="note" x="200" y="431" text-anchor="middle" font-size="19">structured · structuralism</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">知识、观念与作品的构建</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">constructivism · constructivist</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">支撑层与细小内部组织</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">infrastructure · superstructure</text>
<text class="note" x="1000" y="431" text-anchor="middle" font-size="19">· substructure · microstructure</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">重新搭建、调整安排</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">reconstruct · reconstruction ·</text>
<text class="note" x="200" y="581" text-anchor="middle" font-size="19">restructure · restructuring</text>
<text x="600" y="515" text-anchor="middle" font-size="26" font-weight="600">安排、装备 → 教导</text>
<text class="note" x="600" y="555" text-anchor="middle" font-size="19">instruct · instruction ·</text>
<text class="note" x="600" y="581" text-anchor="middle" font-size="19">instructor · instructive</text>
<text x="1000" y="515" text-anchor="middle" font-size="26" font-weight="600">在前面堆起 → 阻碍</text>
<text class="note" x="1000" y="555" text-anchor="middle" font-size="19">obstruct · obstruction ·</text>
<text class="note" x="1000" y="581" text-anchor="middle" font-size="19">obstructive · obstructionist</text>
<text x="200" y="665" text-anchor="middle" font-size="26" font-weight="600">拆开分析构成</text>
<text class="note" x="200" y="705" text-anchor="middle" font-size="19">deconstruction · deconstruct ·</text>
<text class="note" x="200" y="731" text-anchor="middle" font-size="19">deconstructive</text>
<text x="600" y="665" text-anchor="middle" font-size="26" font-weight="600">拆毁、损坏与耐损坏</text>
<text class="note" x="600" y="705" text-anchor="middle" font-size="19">destroy · destruction ·</text>
<text class="note" x="600" y="731" text-anchor="middle" font-size="19">destructive · indestructible</text>
</svg>