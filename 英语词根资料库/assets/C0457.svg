<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="815" viewBox="0 0 1200 815" role="img">
<title>fund-, fus-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="813" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">FUND / FUS = POUR</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">把液体倒出去：可混合、流入、散开，也可倒回来</text>
<text class="note" x="600" y="155" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="215" text-anchor="middle" font-size="26" font-weight="600">倒到一起，分不清</text>
<text class="note" x="200" y="255" text-anchor="middle" font-size="19">confound · confuse · confusion</text>
<text x="600" y="215" text-anchor="middle" font-size="26" font-weight="600">熔合成一体</text>
<text class="note" x="600" y="255" text-anchor="middle" font-size="19">fusion · fuse · fused</text>
<text x="1000" y="215" text-anchor="middle" font-size="26" font-weight="600">向里面注入</text>
<text class="note" x="1000" y="255" text-anchor="middle" font-size="19">infuse · infusion · infuser</text>
<text x="200" y="365" text-anchor="middle" font-size="26" font-weight="600">向四周散开</text>
<text class="note" x="200" y="405" text-anchor="middle" font-size="19">diffuse · diffusion · diffusely</text>
<text x="600" y="365" text-anchor="middle" font-size="26" font-weight="600">转输、流过组织</text>
<text class="note" x="600" y="405" text-anchor="middle" font-size="19">transfusion · perfusion ·</text>
<text class="note" x="600" y="431" text-anchor="middle" font-size="19">reperfusion</text>
<text x="1000" y="365" text-anchor="middle" font-size="26" font-weight="600">大量向外涌</text>
<text class="note" x="1000" y="405" text-anchor="middle" font-size="19">profuse · profusion · effusive</text>
<text x="200" y="515" text-anchor="middle" font-size="26" font-weight="600">颜色、感觉漫开</text>
<text class="note" x="200" y="555" text-anchor="middle" font-size="19">suffuse · suffusion</text>
<text x="600" y="515" text-anchor="middle" font-size="26" font-weight="600">把钱退回来</text>
<text class="note" x="600" y="555" text-anchor="middle" font-size="19">refund · refundable</text>
<text x="1000" y="515" text-anchor="middle" font-size="26" font-weight="600">浇铸与熔化支线</text>
<text class="note" x="1000" y="555" text-anchor="middle" font-size="19">foundry · font · fondue ·</text>
<text class="note" x="1000" y="581" text-anchor="middle" font-size="19">fondant</text>
<text x="200" y="665" text-anchor="middle" font-size="26" font-weight="600">留不住，难起作用</text>
<text class="note" x="200" y="705" text-anchor="middle" font-size="19">futile · futility</text>
<text x="600" y="665" text-anchor="middle" font-size="26" font-weight="600">远源争议、同形辨析</text>
<text class="note" x="600" y="705" text-anchor="middle" font-size="19">refuse · refusal · defuse</text>
</svg>