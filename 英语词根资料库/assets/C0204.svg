<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="712" viewBox="0 0 1200 712" role="img">
<title>cern-, cer-：意义分支</title>
<style>text{font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#202020}.note{fill:#727272}</style>
<rect x="1" y="1" width="1198" height="710" rx="18" fill="#fdfdfd" stroke="#dedede" stroke-width="1.5"/>
<text x="600" y="62" text-anchor="middle" font-size="31" font-weight="600">CERN / CERT / CRET = SEPARATE &amp; DISCERN</text>
<text class="note" x="600" y="103" text-anchor="middle" font-size="22">想象拿着筛子把混在一起的东西分开：看出区别，可以作判断；选定一个结果，可以变得确定；拿出一</text>
<text class="note" x="600" y="134" text-anchor="middle" font-size="22">份藏在旁边，可以成为秘密。</text>
<text class="note" x="600" y="186" text-anchor="middle" font-size="30">↓</text>
<text x="200" y="246" text-anchor="middle" font-size="26" font-weight="600">辨清、定下来</text>
<text class="note" x="200" y="286" text-anchor="middle" font-size="19">certain / ascertain / certainty</text>
<text class="note" x="200" y="312" text-anchor="middle" font-size="19">/ certify</text>
<text x="600" y="246" text-anchor="middle" font-size="26" font-weight="600">看出区别与守分寸</text>
<text class="note" x="600" y="286" text-anchor="middle" font-size="19">discern / discernment /</text>
<text class="note" x="600" y="312" text-anchor="middle" font-size="19">discrete / discreet /</text>
<text class="note" x="600" y="338" text-anchor="middle" font-size="19">discretion</text>
<text x="1000" y="246" text-anchor="middle" font-size="26" font-weight="600">单独放到隐蔽处</text>
<text class="note" x="1000" y="286" text-anchor="middle" font-size="19">secret / secrecy / secretary /</text>
<text class="note" x="1000" y="312" text-anchor="middle" font-size="19">secretariat</text>
<text x="200" y="412" text-anchor="middle" font-size="26" font-weight="600">生理上分离并送出</text>
<text class="note" x="200" y="452" text-anchor="middle" font-size="19">secrete / secretion / secretory；</text>
<text class="note" x="200" y="478" text-anchor="middle" font-size="19">excrete / excretion</text>
<text x="600" y="412" text-anchor="middle" font-size="26" font-weight="600">涉及、牵动与担心</text>
<text class="note" x="600" y="452" text-anchor="middle" font-size="19">concern / concerned /</text>
<text class="note" x="600" y="478" text-anchor="middle" font-size="19">concerning</text>
<text x="1000" y="412" text-anchor="middle" font-size="26" font-weight="600">正式作出判定</text>
<text class="note" x="1000" y="452" text-anchor="middle" font-size="19">decree / decretal</text>
<text x="200" y="562" text-anchor="middle" font-size="26" font-weight="600">需保留词源疑问的音乐旁支</text>
<text class="note" x="200" y="602" text-anchor="middle" font-size="19">concert / concerto / concertina</text>
<text class="note" x="200" y="628" text-anchor="middle" font-size="19">/ concertmaster / disconcert</text>
</svg>